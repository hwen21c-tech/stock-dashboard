<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>TCG fit check</title>
<style>
 body{margin:0;background:#06060a;color:#dcd;font:12px/1.5 sans-serif;display:flex;gap:14px;padding:10px;align-items:flex-start}
 .col{display:flex;flex-direction:column;gap:6px}
 .frame{border:1px solid #444;border-radius:8px;overflow:hidden;background:#000}
 iframe{border:0;display:block}
 pre{max-width:560px;white-space:pre-wrap;color:#9fe;font-size:11px}
</style></head><body>
<div class="col"><b>400×860</b><div class="frame"><iframe id="f400" src="./index.html?v=4" width="400" height="860"></iframe></div></div>
<div class="col"><b>884×960</b><div class="frame"><iframe id="f884" src="./index.html?v=4" width="884" height="960"></iframe></div></div>
<pre id="out">running…</pre>
<script>
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, ms = 8000) { const t0 = Date.now(); while (Date.now() - t0 < ms) { try { if (fn()) return true; } catch (e) {} await sleep(120); } return false; }
function click(d, sel) { const el = d.querySelector(sel); if (el && !el.disabled) { el.click(); return true; } return false; }

async function measure(w, d) {
  const imgs = [...d.images];
  return {
    vw: w.innerWidth, vh: w.innerHeight,
    overflowX: Math.max(0, d.documentElement.scrollWidth - w.innerWidth),
    overflowY: Math.max(0, d.documentElement.scrollHeight - w.innerHeight),
    scrollH: d.documentElement.scrollHeight,
    imgs: imgs.length,
    badImgs: imgs.filter(i => i.complete && i.naturalWidth === 0).length,
    pendingImgs: imgs.filter(i => !i.complete).length
  };
}
async function unlock(d) {
  if (d.querySelector('.pinpad')) {
    for (const v of '0623') { const b = d.querySelector(`[data-act="pin"][data-v="${v}"]`); if (b) b.click(); await sleep(150); }
    await until(() => d.querySelector('.modes'), 5000);
  }
  return !!d.querySelector('.modes');
}

async function run(id, label) {
  const f = document.getElementById(id), w = f.contentWindow, d = f.contentDocument;
  const rep = { label };
  await until(() => d.querySelector('.pinpad') || d.querySelector('.modes'), 15000);
  rep.unlocked = await unlock(d);
  await sleep(300);
  rep.home = await measure(w, d);

  // 덱 선택 화면
  click(d, '[data-act="toDecks"]');
  await until(() => d.querySelector('[data-act="startBattle"]'), 5000);
  await sleep(400);
  rep.decks = await measure(w, d);
  rep.decksHasBack = !!d.querySelector('[data-act="startBattle"]');

  // 배틀 시작
  click(d, '[data-act="startBattle"]');
  await until(() => d.querySelector('.battle') && d.querySelector('[data-act="endTurn"]'), 8000);
  await sleep(1200);
  const B = w.__B, D = w.__DEBUG;
  rep.engineOk = !!B && !!D;
  if (!B || !D) { return rep; }
  rep.battle = await measure(w, d);
  rep.mine = B.players[0].active ? B.players[0].active.card.name : null;
  rep.foe = B.players[1].active ? B.players[1].active.card.name : null;
  rep.handCount = d.querySelectorAll('.handrow .card').length;
  rep.cardRect = (() => { const c = d.querySelector('.card.active'); if (!c) return null; const r = c.getBoundingClientRect(); return [Math.round(r.width), Math.round(r.height)]; })();

  // 1) 에너지 붙이기 (실제 클릭)
  const enBtn = d.querySelector('.enbtn');
  const before = d.querySelectorAll('.side.me .card.active .enrow .en-dot').length;
  if (enBtn) {
    enBtn.click(); await sleep(250);
    const mine = d.querySelector('.side.me .card.active');
    if (mine) { mine.click(); await sleep(800); }
  }
  rep.energy = { before, after: d.querySelectorAll('.side.me .card.active .enrow .en-dot').length, usedChip: !!d.querySelector('.energybar .chip') };

  // 2) 특성 발동 (콜로솔트: 에너지 암염 — 트래쉬 에너지 장착 + 30 회복)
  const abU = D.unitOf('SV4K-040');
  abU.enteredTurn = 0; abU.dmg = 60;
  B.players[0].active = abU;
  B.players[0].energyUsed = true; B.players[0].abilityUsed = false;
  B.busy = false; B.cur = 0;
  D.render(); await sleep(600);
  const abBtn = d.querySelector('[data-act="ability"]:not([disabled])');
  rep.abilityButton = !!abBtn;
  if (abBtn) {
    abBtn.click(); await sleep(1600);
    rep.ability = {
      energies: B.players[0].active.energies.length,
      dmgAfterHeal: B.players[0].active.dmg,
      log: [...d.querySelectorAll('#sidepanel div')].map(x => x.textContent).filter(t => t.includes('특성') || t.includes('회복')).slice(-2).join(' / ')
    };
  }

  // 3) 약점 ×2 (앤티골 불꽃 → 야나프 풀 약점 불꽃)
  const atkU = D.unitOf('SV5K-009'); D.addEnergy(atkU, ['Fire', 'Fire', 'Colorless']); atkU.enteredTurn = 0;
  B.players[0].active = atkU;
  const foeU = D.unitOf('SV4K-001');
  B.players[1].active = foeU;
  B.players[0].energyUsed = true; B.players[0].cantAttack = false; B.busy = false; B.cur = 0;
  D.render(); await sleep(600);
  rep.attackBtns = [...d.querySelectorAll('[data-act="attack"]')].map(b => ({ t: b.textContent.trim().slice(0, 20), dis: b.disabled }));
  const bigBtn = [...d.querySelectorAll('[data-act="attack"]:not([disabled])')].pop();
  const foeBefore = B.players[1].active.dmg;
  if (bigBtn) { bigBtn.click(); await sleep(600); }
  rep.critPopup = !!d.querySelector('.dmg-pop.crit');
  await sleep(3200);
  rep.weakness = { name: B.players[1].active ? B.players[1].active.card.name : null,
                   before: foeBefore, dmgAfter: B.players[1].active ? B.players[1].active.dmg : null, expected: 260 };

  // 4) 코인토스 (비조도 삼단찌르기: 동전 3번 × 20)
  const B2 = w.__B;
  if (B2 && !B2.over) {
    const coinU = D.unitOf('SV4K-034'); D.addEnergy(coinU, ['Fighting']); coinU.enteredTurn = 0;
    B2.players[B2.cur].active = coinU;
    B2.players[B2.cur].cantAttack = false; B2.players[B2.cur].energyUsed = true; B2.busy = false;
    D.render(); await sleep(600);
    const cb = [...d.querySelectorAll('[data-act="attack"]:not([disabled])')].find(b => b.textContent.includes('삼단'));
    rep.coinBtn = !!cb;
    if (cb) cb.click();
    await sleep(700);
    rep.coinOverlay = !!d.querySelector('#coinEl');
    await sleep(6500);
    rep.coinDone = !d.querySelector('#coinEl');
  }
  rep.afterAction = await measure(w, d);

  // 5) 카드팩 (실제 클릭)
  click(d, '[data-act="home"]'); await sleep(500);
  if (d.querySelector('[data-act="confirmYes"]')) { d.querySelector('[data-act="confirmYes"]').click(); await sleep(500); }
  click(d, '[data-act="goPack"]');
  await until(() => d.querySelector('#packEl'), 5000);
  await sleep(600);
  rep.packBefore = await measure(w, d);
  click(d, '#packEl');
  await sleep(4500);
  rep.pack = {
    revealed: d.querySelectorAll('#packResult .reveal:not(.facedown)').length,
    total: d.querySelectorAll('#packResult .reveal').length,
    badImgs: [...d.images].filter(i => i.complete && i.naturalWidth === 0).length
  };
  rep.packAfter = await measure(w, d);
  rep.coins = w.__DEBUG.S.coins;
  return rep;
}

(async () => {
  const out = document.getElementById('out');
  const r = {};
  try { r.a = await run('f400', '400x860'); } catch (e) { r.errA = String(e && e.stack || e); }
  out.textContent = JSON.stringify(r, null, 1);
  try { r.b = await run('f884', '884x960'); } catch (e) { r.errB = String(e && e.stack || e); }
  window.__report = r;
  out.textContent = JSON.stringify(r, null, 1);
  window.__ready = true;
})();
</script>
</body></html>
