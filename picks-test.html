<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>picks.html 반응형 실측 하네스</title>
<style>
body{margin:0;background:#222;color:#eee;font-family:system-ui,sans-serif;font-size:13px}
.row{display:flex;gap:14px;padding:14px;align-items:flex-start;flex-wrap:wrap}
.cell{background:#333;border-radius:8px;padding:8px}
.cell h2{margin:0 0 6px;font-size:12px;color:#7dd3fc}
iframe{border:0;display:block;background:#fff}
pre{white-space:pre-wrap;font-size:11px;color:#a3e635;margin:6px 0 0;max-width:900px}
.bad{color:#f87171;font-weight:700}
</style>
</head>
<body>
<div id="out" style="padding:12px 14px;background:#111"><b>측정 결과</b><pre id="log">측정 중…</pre></div>
<div class="row" id="row"></div>
<script>
var SIZES = [
  { w:400, h:860, name:'400 폴드8 외부' },
  { w:430, h:900, name:'430 일반폰' },
  { w:884, h:960, name:'884 폴드8 내부' },
  { w:1280, h:900, name:'1280 PC' }
];
var results = [];
var ONLY = new URLSearchParams(location.search).get('only');
if (ONLY) SIZES = SIZES.filter(function(x){ return String(x.w) === ONLY; });
function measure(win, doc, spec){
  var iw = win.innerWidth, sw = doc.documentElement.scrollWidth, bw = doc.body.scrollWidth;
  var over = [];
  var all = doc.querySelectorAll('body *');
  for (var i=0;i<all.length;i++){
    var el = all[i];
    if (el.closest('iframe')) continue;
    var r = el.getBoundingClientRect();
    if (r.width === 0 && r.height === 0) continue;
    var cs = win.getComputedStyle(el);
    if (cs.position === 'fixed') continue;
    if (r.right > iw + 1 || r.left < -1){
      over.push((el.tagName.toLowerCase()) + (el.id?'#'+el.id:'') + (el.className && typeof el.className==='string'? '.'+el.className.trim().split(/\s+/).join('.'):'') + ' right=' + Math.round(r.right));
      if (over.length > 6) break;
    }
  }
  return { name: spec.name, w: spec.w, iw: iw, sw: sw, bw: bw, overflow: Math.max(0, sw - iw), offenders: over,
           cards: doc.querySelectorAll('.card').length, chips: doc.querySelectorAll('.chip').length,
           sample: doc.getElementById('sampleNotice') ? !doc.getElementById('sampleNotice').hidden : null,
           foot: doc.getElementById('footStat') ? doc.getElementById('footStat').textContent : '' };
}
SIZES.forEach(function(spec){
  var cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = '<h2>' + spec.name + ' · ' + spec.w + '×' + spec.h + '</h2>';
  var f = document.createElement('iframe');
  f.width = spec.w; f.height = spec.h; f.loading = 'eager';
  f.src = './picks.html?harness=' + spec.w;
  f.setAttribute('data-w', spec.w);
  cell.appendChild(f);
  document.getElementById('row').appendChild(cell);
  f.addEventListener('load', function(){
    setTimeout(function(){
      try {
        var r = measure(f.contentWindow, f.contentDocument, spec);
        results.push(r);
        render();
      } catch(e){
        results.push({ name: spec.name, w: spec.w, error: String(e) });
        render();
      }
    }, 2600);
  });
});
function render(){
  var lines = results.map(function(r){
    if (r.error) return r.name + ' ERROR ' + r.error;
    return (r.overflow === 0 ? 'OK  ' : 'BAD ') + r.name + ' | innerWidth=' + r.iw + ' scrollWidth=' + r.sw +
      ' overflow=' + r.overflow + 'px cards=' + r.cards + ' chips=' + r.chips + ' sample=' + r.sample +
      ' foot="' + r.foot + '"' + (r.offenders.length ? '\n     넘친 요소: ' + r.offenders.join(' | ') : '');
  });
  document.getElementById('log').textContent = lines.join('\n') || '측정 중…';
  window.__RESULTS__ = results;
}
</script>
</body>
</html>
