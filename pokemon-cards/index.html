<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b1030">
<title>포켓몬 카드팩 도감</title>
<link rel="manifest" href="pokemon-cards.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preload" as="image" href="assets/card-back.jpg">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="tb-row">
      <div class="brand" id="brandBtn">
        <span class="ball"></span>
        <div class="brand-txt"><b>포켓몬 카드팩</b><small>도감 · 배틀</small></div>
      </div>
      <div class="top-right">
        <button class="coin-chip" id="coinChip" title="코인"><span>🪙</span><b id="coinNum">0</b></button>
        <button class="pf-chip" id="pfChip"><span id="pfEmoji">🐣</span><b id="pfName">아린</b></button>
        <button class="icon-btn" id="vibBtn" title="진동" aria-label="진동 켜기/끄기">📳</button>
        <button class="icon-btn" id="soundBtn" title="소리">🔊</button>
      </div>
    </div>
    <div class="tb-sub">
      <a class="back-pill" id="backWorld" href="https://hwen21c-tech.github.io/stock-dashboard/pokemon-battle/">🏠 배틀 월드</a>
      <span class="cloud-chip" id="cloudChip" data-s="idle"><i></i><span id="cloudTxt">가족 동기화</span></span>
    </div>
  </header>

  <main id="main">
    <section class="screen active" id="screen-home"></section>
    <section class="screen" id="screen-shop"></section>
    <section class="screen" id="screen-dex"></section>
    <section class="screen" id="screen-battle"></section>
    <section class="screen" id="screen-more"></section>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-tab="home"><span>🏠</span><b>홈</b></button>
    <button class="tab" data-tab="shop"><span>🛍️</span><b>카드팩</b></button>
    <button class="tab" data-tab="dex"><span>📖</span><b>도감</b></button>
    <button class="tab" data-tab="battle"><span>⚔️</span><b>배틀</b></button>
    <button class="tab" data-tab="more"><span>🎒</span><b>내정보</b></button>
  </nav>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="fxRoot"></div>

<script src="js/util.js"></script>
<script src="js/cloud.js"></script>
<script src="js/audio.js"></script>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/shop.js"></script>
<script src="js/dex.js"></script>
<script src="js/battle.js"></script>
<script src="js/more.js"></script>
<script src="js/main.js"></script>
</body>
</html>
