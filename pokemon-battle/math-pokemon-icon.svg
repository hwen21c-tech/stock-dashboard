  <path d="M6 366c58-26 118-12 178 8s134 22 202-8c46-20 76-16 114-2v148H6z" fill="#2a8a1d" fill-opacity="0.55"/>
  <path d="M6 400c64-18 122 4 182 18s136 16 200-12c44-20 74-16 112-4v98H6z" fill="#1b6a12" fill-opacity="0.55"/>

