    <path d="M106 146c3.8 16.6 8.4 21.2 25 25-16.6 3.8-21.2 8.4-25 25-3.8-16.6-8.4-21.2-25-25 16.6-3.8 21.2-8.4 25-25z" opacity="0.8"/>
    <path d="M436 300c3 13 6.6 16.6 19.6 19.6-13 3-16.6 6.6-19.6 19.6-3-13-6.6-16.6-19.6-19.6 13-3 16.6-6.6 19.6-19.6z" opacity="0.7"/>
