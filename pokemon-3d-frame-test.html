<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D 아지트 검증 프레임 (400×860 · 884×960)</title>
<style>
  html,body{margin:0;padding:0;background:#1b2430;font-family:system-ui,sans-serif;color:#cfd8e3}
  #bar{height:30px;display:flex;align-items:center;gap:8px;padding:0 8px;font-size:12px;background:#0f1620}
  #bar b{color:#ffd166}
  iframe{border:0;display:block;background:#bfe6f7}
</style>
</head>
<body>
<div id="bar"><b id="tag">frame</b><span id="info"></span></div>
<iframe id="f" src="./pokemon-3d-test.html" title="3D 아지트 검증"></iframe>
<script>
  const q = new URLSearchParams(location.search);
  const w = Math.max(280, Math.min(1200, Number(q.get('w')) || 400));
  const h = Math.max(400, Math.min(1000, Number(q.get('h')) || 860));
  const f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = h + 'px';
  document.getElementById('tag').textContent = w + '×' + h;
  document.getElementById('info').textContent = 'pokemon-3d-test.html';
</script>
</body>
</html>
