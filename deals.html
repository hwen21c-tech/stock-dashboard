<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>✈️ 패밀리 특가 레이더 (여행 & 키즈 혜택 관제탑)</title>
  <style>
    :root {
      --bg: #070c14;
      --card-bg: #0b1120;
      --card-hover: #111a2e;
      --border: rgba(56, 189, 248, 0.2);
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --accent: #38bdf8;
      --accent-grad: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
      --deal-red: #f43f5e;
      --gold: #f59e0b;
      --green: #22c55e;
      --purple: #a855f7;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Pretendard', 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 10px;
      max-width: 1400px;
      margin: 0 auto;
      -webkit-font-smoothing: antialiased;
    }
    /* HEADER */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      font-size: 26px;
      background: rgba(56, 189, 248, 0.12);
      padding: 6px 10px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-sub);
    }
    .hdr-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-nav {
      padding: 6px 12px;
      background: #1e293b;
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 800;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-nav:hover {
      background: rgba(56, 189, 248, 0.15);
    }

    /* SEARCH BAR */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .search-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 8px 14px;
      color: #fff;
      font-size: 12.5px;
      outline: none;
    }
    .search-input:focus {
      border-color: var(--accent);
    }

    /* CATEGORY TABS */
    .cat-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-btn {
      padding: 8px 16px;
      background: var(--card-bg);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .cat-btn.active {
      background: var(--accent-grad);
      color: #ffffff;
      border-color: #38bdf8;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    /* SUB FILTERS */
    .filter-bar {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .filter-chip {
      padding: 4px 10px;
      background: #111827;
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-chip.active {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* GRID & CARDS */
    .deals-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(370px, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }
    .deal-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
      position: relative;
    }
    .deal-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      background: var(--card-hover);
    }

    /* CARD HEADER */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
    }
    .card-tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .tag {
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
    }
    .tag-resort { background: rgba(56, 189, 248, 0.15); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.3); }
    .tag-city { background: rgba(168, 85, 247, 0.15); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.3); }
    .tag-family { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .tag-snow { background: rgba(14, 165, 233, 0.15); color: #7dd3fc; border: 1px solid rgba(14, 165, 233, 0.3); }
    .tag-discount { background: rgba(244, 63, 94, 0.2); color: #f43f5e; border: 1px solid rgba(244, 63, 94, 0.4); font-size: 11px; }

    .card-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
      line-height: 1.35;
    }
    .card-sub {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    /* RATING & REVIEWS BADGE */
    .rating-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #fbbf24;
      margin-bottom: 8px;
    }
    .rating-num {
      font-weight: 800;
      color: #fef08a;
    }
    .rating-cnt {
      color: #94a3b8;
      font-size: 10px;
    }

    /* PRICE BOX & BENCHMARK */
    .price-box {
      background: #070c14;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 10px;
    }
    .price-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .price-deal {
      font-size: 17px;
      font-weight: 900;
      color: var(--deal-red);
    }
    .price-pills {
      display: flex;
      flex-direction: column;
      gap: 2px;
      align-items: flex-end;
    }
    .pill-item {
      font-size: 9.5px;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      padding: 1px 6px;
      border-radius: 3px;
      border: 1px solid rgba(34, 197, 94, 0.25);
    }

    /* VALUE BENCHMARK BAR (HISTORICAL COMPARISON) */
    .benchmark-wrap {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.08);
      font-size: 10.5px;
    }
    .bm-history {
      display: flex;
      justify-content: space-between;
      color: #94a3b8;
      margin-bottom: 4px;
    }
    .bm-saved {
      background: rgba(244, 63, 94, 0.1);
      border: 1px solid rgba(244, 63, 94, 0.3);
      color: #fda4af;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* CALLOUT BOXES */
    .season-box {
      background: rgba(245, 158, 11, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11.5px;
      color: #fef08a;
      line-height: 1.45;
      margin-bottom: 8px;
    }
    .season-label {
      font-weight: 800;
      color: var(--gold);
      display: flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 2px;
    }
    .family-box {
      background: rgba(56, 189, 248, 0.06);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.4;
      margin-bottom: 8px;
    }

    /* REAL PARENT REVIEWS BOX */
    .review-box {
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      font-weight: 800;
      color: #a5b4fc;
      margin-bottom: 4px;
    }
    .review-quote {
      color: #e2e8f0;
      font-style: italic;
      margin-bottom: 3px;
    }

    /* ACTION BUTTON */
    .btn-deal-action {
      display: block;
      text-align: center;
      padding: 8px 12px;
      background: var(--accent-grad);
      color: #ffffff;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 3px 10px rgba(2, 132, 199, 0.3);
      transition: opacity 0.15s;
    }
    .btn-deal-action:hover {
      opacity: 0.92;
    }
  </style>
</head>

  <!-- HEADER -->
  <header>
    <div class="brand">
      <div class="brand-icon">✈️</div>
      <div>
        <div class="brand-title">패밀리 특가 레이더 (Family Deal Radar)</div>
        <div class="brand-sub">동탄 패밀리 맞춤형 · 국내외 여행 특가 & 키즈카페·어린이박물관 혜택 관제탑</div>

    <button class="filter-chip" onclick="setTravelFilter('snow', this)">❄️ 눈꽃·스키</button>
  </div>

  <!-- SUB FILTERS (KIDS) -->
  <div class="filter-bar" id="kidsFilters" style="display: none;">
    <button class="filter-chip active" onclick="setKidsFilter('all', this)">전체</button>
    <button class="filter-chip" onclick="setKidsFilter('dongtan', this)">🎯 동탄 30분권</button>
    <button class="filter-chip" onclick="setKidsFilter('museum', this)">🦕 박물관·과학관</button>
    <button class="filter-chip" onclick="setKidsFilter('kids_cafe', this)">🏰 대형 키즈카페</button>
    <button class="filter-chip" onclick="setKidsFilter('themepark', this)">🎢 테마파크·아쿠아</button>
  </div>

  <!-- DEALS GRID -->
  <div class="deals-grid" id="dealsGrid">

            d.season_reason.toLowerCase().indexOf(currentSearch) !== -1
          );
          return matchSub && matchSearch;
        });

        if (list.length === 0) {
          container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">일치하는 여행 특가가 없습니다.</div>';
          return;
        }

        list.forEach(function(d) {
          var pillsHtml = d.benefit_pills.map(function(p) {
            return '<span class="pill-item">✓ ' + p + '</span>';
          }).join('');

          var tagClass = d.theme === 'resort' ? 'tag-resort' : (d.theme === 'city' ? 'tag-city' : (d.theme === 'family' ? 'tag-family' : 'tag-snow'));

          var reviewsHtml = d.reviews.map(function(r) {
            return '<div class="review-quote">' + r + '</div>';
          }).join('');

          var cardHtml = `
            <div class="deal-card">
              <div>
                <div class="card-top">
                  <div class="card-tags">
                    <span class="tag ${tagClass}">${d.theme_label}</span>
                    <span class="tag tag-discount">${d.discount}</span>
                  </div>
                  <span style="font-size: 11px; color: #38bdf8; font-weight: 700;">${d.region}</span>
                </div>
                <div class="card-title">${d.title}</div>
                <div class="card-sub">${d.flight_type}</div>

                <!-- Rating -->
                <div class="rating-badge">
                  <span>⭐ <span class="rating-num">${d.rating}</span> / 5.0</span>
                  <span class="rating-cnt">(부모 후기 ${d.review_count})</span>
                </div>

                <!-- Price & Benchmark Box -->
                <div class="price-box">
                  <div class="price-row">
                    <div>
                      <span style="font-size: 10px; color: #94a3b8;">평수기 대비 할인</span><br>
                      <span class="price-deal">${d.deal_price}</span>
                    </div>
                    <div class="price-pills">
                      ${pillsHtml}
                    </div>
                  </div>

                  <!-- Historical Price Benchmark -->
                  <div class="benchmark-wrap">
                    <div class="bm-history">
                      <span>여름 성수기: <del>${d.peak_price}</del></span>
                      <span>평수기 평균: <del>${d.normal_price}</del></span>
                    </div>
                    <div class="bm-saved">
                      <span>${d.family_saved}</span>
                      <span style="font-size: 9.5px; color: #4ade80;">${d.price_level_text}</span>
                    </div>
                  </div>
                </div>

                <!-- Why Now -->
                <div class="season-box">
                  <div class="season-label">🌟 지금 이 시기에 가야 하는 이유:</div>
                  ${d.season_reason}
                </div>

                <!-- Family Fit -->
                <div class="family-box">
                  <strong style="color: #38bdf8;">👨‍👩‍👧‍👦 가족 맞춤 팁:</strong> ${d.family_fit}
                </div>

                <!-- Real Parent Reviews -->
                <div class="review-box">
                  <div class="review-header">
                    <span>💬 다녀온 부모님들의 생생 후기</span>
                    <span style="font-size: 10px; color: #38bdf8;">검증 완료 ✓</span>
                  </div>
                  ${reviewsHtml}
                </div>
              </div>

              <a href="${d.link}" target="_blank" class="btn-deal-action">${d.link_label} ➔</a>
            </div>
          `;
          container.innerHTML += cardHtml;
        });

      } else {
        // KIDS DEALS
        var list = kidsDeals.filter(function(k) {
          var matchSub = (currentKidsSub === 'all') ||
                         (currentKidsSub === 'dongtan' && k.location.indexOf('동탄') !== -1) ||
                         (currentKidsSub === k.category);
          var matchSearch = !currentSearch || (
            k.title.toLowerCase().indexOf(currentSearch) !== -1 ||
            k.location.toLowerCase().indexOf(currentSearch) !== -1 ||
            k.tips.toLowerCase().indexOf(currentSearch) !== -1
          );
          return matchSub && matchSearch;
        });

        if (list.length === 0) {
          container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">일치하는 시설 혜택이 없습니다.</div>';
          return;
        }

        list.forEach(function(k) {
          var reviewsHtml = k.reviews.map(function(r) {
            return '<div class="review-quote">' + r + '</div>';
          }).join('');

          var cardHtml = `
            <div class="deal-card">
              <div>
                <div class="card-top">
                  <div class="card-tags">
                    <span class="tag tag-city">${k.cat_label}</span>
                    <span class="tag tag-discount" style="background: rgba(34,197,94,0.15); color: #4ade80; border-color: rgba(34,197,94,0.3);">${k.benefit_tag}</span>
                  </div>
                  <span style="font-size: 11px; color: #fbbf24; font-weight: 700;">${k.target_age}</span>
                </div>
                <div class="card-title">${k.title}</div>
                <div class="card-sub">📍 ${k.location}</div>

                <!-- Rating -->
                <div class="rating-badge">
                  <span>⭐ <span class="rating-num">${k.rating}</span> / 5.0</span>
                  <span class="rating-cnt">(부모 후기 ${k.review_count})</span>
                </div>

                <!-- Price Box & Savings Benchmark -->
                <div class="price-box">
                  <div style="font-size: 10px; color: #94a3b8;">요금 & 특가 혜택</div>
                  <div style="font-size: 14px; font-weight: 800; color: #38bdf8; margin: 2px 0 6px 0;">${k.price_info}</div>
                  <div class="bm-saved" style="background: rgba(34,197,94,0.1); border-color: rgba(34,197,94,0.3); color: #86efac;">
                    <span>${k.family_saved}</span>
                    <span style="font-size: 9.5px; color: #4ade80;">${k.price_level_text}</span>
                  </div>
                </div>

                <!-- Tips -->
                <div class="season-box" style="background: rgba(168,85,247,0.08); border-color: rgba(168,85,247,0.3); color: #e9d5ff;">
                  <div class="season-label" style="color: #c084fc;">💡 놓치면 안 되는 예약/할인 꿀팁:</div>
                  ${k.tips}
                </div>

                <!-- Highlights -->
                <div class="family-box">
                  <strong style="color: #4ade80;">🎪 핵심 즐길거리:</strong> ${k.highlights}
                </div>

                <!-- Real Parent Reviews -->
                <div class="review-box">
                  <div class="review-header">
                    <span>💬 동탄/수도권 부모님들의 실전 후기</span>
                    <span style="font-size: 10px; color: #4ade80;">방문 인증 ✓</span>
                  </div>
                  ${reviewsHtml}
                </div>
              </div>

              <a href="${k.link}" target="_blank" class="btn-deal-action" style="background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);">${k.link_label} ➔</a>
            </div>
          `;
          container.innerHTML += cardHtml;
        });
      }
    }

    // Initial render
    renderDeals();
  </script>
</body>
</html>
