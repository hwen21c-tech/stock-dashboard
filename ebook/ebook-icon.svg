<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="연오랑 eBook 오디오북 — 책과 헤드폰">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2333"/>
      <stop offset="1" stop-color="#0a0e16"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e3bd"/>
      <stop offset="1" stop-color="#e3c795"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#efe4cf"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fd6ff"/>
      <stop offset="1" stop-color="#3b9be0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 배경(마스커블 안전 영역 80% 안쪽에 핵심 요소) -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="248" r="152" fill="#13233a" opacity="0.55"/>

  <!-- 펼친 책 -->
  <g filter="url(#soft)">
    <path d="M96 300 C96 286 106 276 120 276 L246 276 L246 384 L124 384 C108 384 96 372 96 356 Z" fill="url(#page)" stroke="#c9b48c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M416 300 C416 286 406 276 392 276 L266 276 L266 384 L388 384 C404 384 416 372 416 356 Z" fill="url(#page)" stroke="#c9b48c" stroke-width="3" stroke-linejoin="round"/>
    <path d="M120 276 C120 268 128 262 138 262 L250 262 L250 280 L120 280 Z" fill="url(#cover)" opacity="0.9"/>
    <path d="M392 276 C392 268 384 262 374 262 L262 262 L262 280 L392 280 Z" fill="url(#cover)" opacity="0.9"/>
    <path d="M256 276 L256 384" stroke="#b99f74" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- 본문 줄 -->
  <g stroke="#a08a63" stroke-width="7" stroke-linecap="round" opacity="0.55">
    <line x1="124" y1="308" x2="222" y2="308"/>
    <line x1="124" y1="330" x2="206" y2="330"/>
    <line x1="124" y1="352" x2="218" y2="352"/>
    <line x1="290" y1="308" x2="388" y2="308"/>
    <line x1="290" y1="330" x2="372" y2="330"/>
    <line x1="290" y1="352" x2="384" y2="352"/>
  </g>

  <!-- 헤드폰(오디오북) -->
  <g>
    <path d="M152 268 C152 196 200 148 256 148 C312 148 360 196 360 268"
          fill="none" stroke="url(#head)" stroke-width="22" stroke-linecap="round"/>
    <rect x="126" y="246" width="52" height="86" rx="26" fill="url(#head)"/>
    <rect x="334" y="246" width="52" height="86" rx="26" fill="url(#head)"/>
    <rect x="140" y="272" width="24" height="34" rx="12" fill="#0c1420" opacity="0.45"/>
    <rect x="348" y="272" width="24" height="34" rx="12" fill="#0c1420" opacity="0.45"/>
  </g>

  <!-- 음파 -->
  <g fill="none" stroke="#8fe3ff" stroke-linecap="round" opacity="0.75">
    <path d="M404 226 C420 240 420 268 404 282" stroke-width="9"/>
    <path d="M424 208 C450 232 450 280 424 304" stroke-width="9" opacity="0.55"/>
  </g>

  <!-- 재생 표시 -->
  <circle cx="256" cy="416" r="34" fill="#7fd6ff" opacity="0.16"/>
  <path d="M247 400 L275 416 L247 432 Z" fill="#9fe6ff"/>
</svg>
