<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7ec8f0">
<meta name="robots" content="noindex, nofollow">
<title>🏡 3D 포켓몬 아지트 — 잡은 친구들과 입체 마을 산책</title>
<meta name="application-name" content="3D 포켓몬 아지트">
<meta name="apple-mobile-web-app-title" content="포켓몬 아지트">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --ink:#2a3a22;
    --ink-soft:#4a5c3e;
    --panel:rgba(255,255,255,.86);
    --panel-edge:rgba(255,255,255,.95);
    --accent:#ffd166;
    --accent-d:#f0a72c;
    --shadow:0 4px 14px rgba(18,42,24,.20);
    --r:999px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
  body{
    background:#bfe6f7;color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Noto Sans KR",sans-serif;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none;
    -webkit-font-smoothing:antialiased;
  }
  #scene{
    position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;
    cursor:grab;
  }
  #scene.dragging{cursor:grabbing}
  #hud{position:fixed;inset:0;pointer-events:none;overflow:hidden}

  /* ---------- 상단 바 ---------- */
  .topbar{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 7px);
    left:max(7px,env(safe-area-inset-left,0px));right:max(7px,env(safe-area-inset-right,0px));
    display:flex;flex-direction:column;gap:6px;max-width:100%;
  }
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:100%;pointer-events:auto}
  .row1{justify-content:space-between}
  .row2{justify-content:flex-end}
  .brand{
    pointer-events:auto;display:flex;align-items:center;gap:6px;
    background:var(--panel);border:1.5px solid var(--panel-edge);border-radius:var(--r);
    padding:6px 12px 6px 10px;box-shadow:var(--shadow);
    font-weight:900;font-size:13.5px;letter-spacing:-.2px;white-space:nowrap;
    color:#22401f;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    min-width:0;overflow:hidden;text-overflow:ellipsis;
  }
  .brand .em{font-size:15px}
  .dexchip{
    pointer-events:auto;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    background:linear-gradient(180deg,#fff8dc,#ffe9a8);border:1.5px solid #fff;
    border-radius:var(--r);padding:6px 11px;box-shadow:var(--shadow);
    font-weight:800;font-size:12px;color:#7a4b04;
  }
  .dexchip b{font-size:13px;color:#b3560a}
  .seg{
    display:inline-flex;align-items:center;gap:2px;padding:3px;
    background:var(--panel);border:1.5px solid var(--panel-edge);border-radius:var(--r);
    box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  }
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--ink-soft);
    font:inherit;font-weight:800;font-size:12px;padding:5px 9px;border-radius:var(--r);
    display:inline-flex;align-items:center;gap:3px;cursor:pointer;transition:background .18s,color .18s,transform .12s;
    white-space:nowrap;
  }
  .seg button.on{background:linear-gradient(180deg,#fff6c9,#ffdf7a);color:#6b4200;box-shadow:0 2px 6px rgba(180,120,0,.22)}
  .seg button:active{transform:scale(.96)}
  button.chip{
    appearance:none;font:inherit;font-weight:800;font-size:12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;white-space:nowrap;
    background:var(--panel);color:#25401f;border:1.5px solid var(--panel-edge);
    border-radius:var(--r);padding:7px 11px;box-shadow:var(--shadow);
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);transition:transform .12s,background .18s;
  }
  button.chip:active{transform:scale(.96);background:#fffbe8}
  button.chip.on{background:linear-gradient(180deg,#e7ffd6,#c8f5a8);border-color:#fff}
  #btnSound{min-width:38px;justify-content:center;padding:7px 9px}

  /* ---------- 하단 안내 ---------- */
  .hint{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 62px);
    max-width:calc(100% - 16px);
    background:rgba(255,255,255,.82);border:1.5px solid rgba(255,255,255,.95);
    border-radius:14px;padding:7px 12px;box-shadow:var(--shadow);
    font-size:11.5px;font-weight:700;line-height:1.35;color:#3d5633;text-align:center;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    pointer-events:none;transition:opacity .6s;
  }
  .hint.gone{opacity:0}

  /* ---------- 말풍선 ---------- */
  #bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  .bub{
    position:absolute;transform:translate(-50%,-100%);
    background:rgba(255,255,255,.96);border:2px solid #fff;border-radius:14px;
    padding:5px 10px;font-size:12.5px;font-weight:900;color:#2f4a22;white-space:nowrap;
    box-shadow:0 6px 16px rgba(20,50,30,.24);
    opacity:0;transition:opacity .22s ease-out, transform .22s ease-out;
  }
  .bub.show{opacity:1}
  .bub .nm{color:#c9560b}
  .bub:after{
    content:"";position:absolute;left:50%;bottom:-6px;width:11px;height:11px;
    background:#fff;transform:translateX(-50%) rotate(45deg);
    border-right:2px solid #fff;border-bottom:2px solid #fff;border-radius:0 0 3px 0;
  }

  /* ---------- 토스트 ---------- */
  #toast{
    position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);
    transform:translate(-50%,10px);opacity:0;transition:opacity .3s,transform .3s;
    background:rgba(38,64,32,.92);color:#fff;border-radius:var(--r);
    padding:8px 14px;font-size:12px;font-weight:800;white-space:nowrap;
    box-shadow:0 8px 20px rgba(10,30,10,.3);pointer-events:none;max-width:calc(100% - 24px);
    overflow:hidden;text-overflow:ellipsis;
  }
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* ---------- 로딩 / 오류 ---------- */
  #loading{
    position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(180deg,#9fdcf7,#e8fbf0);z-index:30;
    transition:opacity .5s;padding:20px;
  }
  #loading.done{opacity:0;pointer-events:none}
  .loadcard{
    background:rgba(255,255,255,.94);border-radius:20px;padding:20px 22px;text-align:center;
    box-shadow:0 14px 40px rgba(20,60,40,.22);max-width:320px;
  }
  .loadcard .title{font-weight:900;font-size:15px;color:#2c4a22;margin-bottom:6px}
  .loadcard .sub{font-size:12px;color:#5b7350;font-weight:700;line-height:1.5}
  .spin{
    width:38px;height:38px;margin:0 auto 12px;border-radius:50%;
    border:4px solid #dff0c8;border-top-color:#63b83f;animation:sp .9s linear infinite;
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  .err .spin{display:none}
  .loadcard button{
    margin-top:12px;appearance:none;border:0;border-radius:var(--r);
    background:linear-gradient(180deg,#6fd04a,#4da62c);color:#fff;font:inherit;font-weight:900;
    font-size:13px;padding:9px 18px;cursor:pointer;box-shadow:0 4px 12px rgba(60,140,30,.35);
  }

  /* ---------- 가족 전환 바 (하단) ---------- */
  .whobar{
    position:absolute;left:50%;transform:translateX(-50%);
    bottom:calc(env(safe-area-inset-bottom,0px) + 9px);
    display:flex;align-items:center;gap:3px;padding:4px 5px;
    background:var(--panel);border:1.5px solid var(--panel-edge);border-radius:var(--r);
    box-shadow:var(--shadow);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    pointer-events:auto;max-width:calc(100% - 12px);white-space:nowrap;
  }
  .who{
    appearance:none;border:0;background:transparent;font:inherit;
    font-weight:900;font-size:11.5px;color:#43603a;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:var(--r);
    transition:background .18s,color .18s,transform .12s;white-space:nowrap;
  }
  .who .dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.92),0 1px 2px rgba(20,40,20,.2)}
  .who.on{background:linear-gradient(180deg,#fff6c9,#ffdf7a);color:#6b4200;box-shadow:0 2px 6px rgba(180,120,0,.22)}
  .who:active{transform:scale(.96)}
  .whobar .sep{width:1px;height:17px;background:rgba(60,90,50,.16);margin:0 2px;flex:none}
  .whobar button.pick{
    appearance:none;border:0;background:transparent;font:inherit;font-weight:900;font-size:11.5px;
    color:#7a4b04;cursor:pointer;display:inline-flex;align-items:center;gap:4px;
    padding:5px 9px;border-radius:var(--r);white-space:nowrap;transition:transform .12s,background .18s;
  }
  .whobar button.pick:active{transform:scale(.96);background:#fffbe8}

  /* ---------- 친구 고르기 모달 ---------- */
  #dexModal{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    padding:calc(env(safe-area-inset-top,0px) + 8px) 8px calc(env(safe-area-inset-bottom,0px) + 8px);
    background:rgba(18,38,20,.46);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
  }
  #dexModal[hidden]{display:none}
  .modalCard{
    width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;
    background:#fffdf7;border:2px solid #fff;border-radius:20px;
    box-shadow:0 22px 60px rgba(10,30,15,.34);overflow:hidden;
  }
  .mHead{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:11px 14px 9px;background:linear-gradient(180deg,#fff6d8,#ffe9b0);
    border-bottom:1.5px solid #f4dfa4;
  }
  .mHead b{font-size:14px;color:#6b4200;letter-spacing:-.2px}
  .mHead .x{
    appearance:none;border:0;background:rgba(255,255,255,.75);color:#7a5a20;
    width:28px;height:28px;border-radius:50%;font:inherit;font-weight:900;font-size:14px;cursor:pointer;flex:none;
  }
  .mSub{padding:8px 14px 0;font-size:11px;font-weight:700;color:#6d7f62;line-height:1.45}
  .slots{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:9px 12px 4px;overflow:auto;-webkit-overflow-scrolling:touch;min-height:0}
  .slot{background:#f7fcf2;border:1.5px solid #e2eed7;border-radius:14px;padding:7px 7px 8px;min-height:0;display:flex;flex-direction:column}
  .slot h4{margin:0 0;font-size:12px;color:#38531f;display:flex;align-items:center;gap:5px;font-weight:900}
  .slot h4 .cnt{margin-left:auto;font-size:10.5px;color:#8a6a12;background:#fff3c9;border-radius:999px;padding:2px 7px;font-weight:900}
  .slot h4 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:96px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:5px;margin-top:6px;overflow:auto;min-height:44px;max-height:min(46vh,330px);align-content:start}
  .tile{
    appearance:none;border:2px solid #e6efe0;background:#fff;border-radius:12px;
    padding:3px 1px 2px;display:flex;flex-direction:column;align-items:center;gap:0;
    cursor:pointer;position:relative;font:inherit;overflow:hidden;
  }
  .tile img{width:40px;height:40px;object-fit:contain;display:block}
  .tile .nm{font-size:9.5px;font-weight:800;color:#3b5730;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.25}
  .tile .ck{position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#dfe9d7;color:#fff;font-size:9.5px;line-height:14px;text-align:center;font-weight:900}
  .tile.on{border-color:#f3b008;background:linear-gradient(180deg,#fffdf0,#fff2c2);box-shadow:0 0 0 2px rgba(243,176,8,.22) inset}
  .tile.on .ck{background:#5cba3c}
  .tile:active{transform:scale(.97)}
  .slot .empty{font-size:10.5px;font-weight:700;color:#8d9c83;line-height:1.5;padding:8px 2px 4px}
  .mFoot{display:flex;align-items:center;gap:7px;justify-content:flex-end;padding:9px 12px calc(env(safe-area-inset-bottom,0px) + 10px);border-top:1.5px solid #f0ead8}
  .mFoot button{appearance:none;border:0;font:inherit;font-weight:900;font-size:12.5px;border-radius:999px;padding:9px 16px;cursor:pointer}
  .mFoot .ghost{background:#f1f5ec;color:#5b7050}
  .mFoot .primary{background:linear-gradient(180deg,#6fd04a,#4da62c);color:#fff;box-shadow:0 4px 12px rgba(60,140,30,.32)}
  .mFoot .primary:active{transform:scale(.97)}

  /* ---------- 좁은 화면(폴드 외부 400px) ---------- */
  @media (max-width:430px){
    .brand{font-size:12px;padding:5px 10px}
    .dexchip{font-size:11px;padding:5px 9px}
    .seg button{font-size:11.5px;padding:5px 7px}
    button.chip{font-size:11.5px;padding:6px 9px}
    .hint{font-size:10.5px;padding:6px 9px}
    .who,.whobar button.pick{font-size:10.5px;padding:5px 6px;gap:3px}
    .who .dot{width:8px;height:8px}
    .slots{grid-template-columns:1fr;gap:7px}
    .grid{max-height:min(30vh,220px)}
    .mSub{font-size:10.5px}
  }
  @media (max-height:520px){
    .brand,.dexchip{font-size:11px}
    button.chip,.seg button{font-size:11px;padding:5px 8px}
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="3D 포켓몬 아지트"></canvas>

<div id="hud">
  <div class="topbar">
    <div class="row row1">
      <div class="brand"><span class="em">🏡</span><span>3D 포켓몬 아지트</span></div>
      <div class="dexchip" id="dexChip">🐾 친구 <b id="dexNum">6</b></div>
    </div>
    <div class="row row2">
      <div class="seg" id="themeSeg" role="group" aria-label="테마 전환">
        <button data-theme="day" class="on" aria-pressed="true">☀️ 낮</button>
        <button data-theme="sunset" aria-pressed="false">🌇 노을</button>
        <button data-theme="night" aria-pressed="false">🌙 밤</button>
      </div>
      <button class="chip" id="btnReset">↺ 시점 초기화</button>
      <button class="chip" id="btnPhoto">📷 기념사진</button>
      <button class="chip on" id="btnSound" aria-label="소리 켜짐">🔊</button>
    </div>
  </div>

  <div class="whobar" id="whoBar" role="group" aria-label="조종할 가족 고르기">
    <button class="who on" data-who="0" aria-pressed="true"><span class="dot" style="background:#ff8fb1"></span><span class="wname">아린</span></button>
    <button class="who" data-who="1" aria-pressed="false"><span class="dot" style="background:#8fd0f5"></span><span class="wname">지안</span></button>
    <button class="who" data-who="2" aria-pressed="false"><span class="dot" style="background:#ffb38a"></span><span class="wname">엄마</span></button>
    <button class="who" data-who="3" aria-pressed="false"><span class="dot" style="background:#6fbf7c"></span><span class="wname">아빠</span></button>
    <span class="sep"></span>
    <button class="pick" id="btnDex">🐾 친구 고르기</button>
  </div>

  <div id="bubbles"></div>

  <div class="hint" id="hint">바닥 탭·방향키로 걷기 · 포켓몬을 누르면 타입별 인사! · 빨간 지붕 <b>포켓몬 센터</b>를 누르면 모두 회복 💖</div>
  <div id="toast"></div>
</div>

<div id="dexModal" hidden aria-hidden="true">
  <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="dexTitle">
    <div class="mHead">
      <b id="dexTitle">🐾 친구 고르기</b>
      <button class="x" id="dexClose" aria-label="닫기">✕</button>
    </div>
    <div class="mSub">우리 도감에서 한 명당 최대 3마리씩 · 두 명 합쳐 최대 6마리까지 아지트로 불러요</div>
    <div class="slots">
      <section class="slot" data-slot="p1">
        <h4><span style="width:9px;height:9px;border-radius:50%;background:#ff8fb1;display:inline-block"></span><span class="nm" data-name="p1">아린</span>의 도감<span class="cnt" data-cnt="p1">0 / 3</span></h4>
        <div class="grid" data-grid="p1"></div>
        <div class="empty" data-empty="p1" hidden>도감에 잡은 친구가 없어요.<br>게임에서 먼저 잡아 보세요!</div>
      </section>
      <section class="slot" data-slot="p2">
        <h4><span style="width:9px;height:9px;border-radius:50%;background:#8fd0f5;display:inline-block"></span><span class="nm" data-name="p2">지안</span>의 도감<span class="cnt" data-cnt="p2">0 / 3</span></h4>
        <div class="grid" data-grid="p2"></div>
        <div class="empty" data-empty="p2" hidden>도감에 잡은 친구가 없어요.<br>게임에서 먼저 잡아 보세요!</div>
      </section>
    </div>
    <div class="mFoot">
      <button class="ghost" id="dexReset">선택 비우기</button>
      <button class="primary" id="dexApply">아지트에 부르기</button>
    </div>
  </div>
</div>

<div id="loading">
  <div class="loadcard" id="loadCard">
    <div class="spin"></div>
    <div class="title">🌱 아지트를 만드는 중…</div>
    <div class="sub" id="loadSub">잔디 언덕과 연못을 준비하고 있어요</div>
  </div>
</div>

<script type="module">
/* =====================================================================
   🏡 3D 포켓몬 아지트 — Three.js 단일 HTML 샘플 (독립 실행)
   잡은 포켓몬(localStorage: pkm.shared.dex.v1.*)이 있으면 그 친구들이,
   없으면 대표 포켓몬 6마리가 입체 마을에서 놀고 있습니다.
   ===================================================================== */

/* ---------- 0. 유틸 ---------- */
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0 || 1e-6), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20261115);
const rndRange = (a, b) => a + (b - a) * rnd();

/* ---------- 1. 포켓몬 이름표 ---------- */
const KO151 = ('이상해씨,이상해풀,이상해꽃,파이리,리자드,리자몽,꼬부기,어니부기,거북왕,캐터피,단데기,버터플,뿔충이,딱충이,독침붕,' +
  '구구,피죤,피죤투,꼬렛,레트라,깨비참,깨비드릴조,아보,아보크,피카츄,라이츄,모래두지,고지,니드런♀,니드리나,니드퀸,니드런♂,니드리노,니드킹,' +

const SHARED_PREFIX = 'pkm.shared.dex.v1.';
function readCaughtIds() {
  const ids = new Set();
  try {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.indexOf(SHARED_PREFIX) === 0) keys.push(k);
    }
    keys.forEach((k) => {
      if (k === SHARED_PREFIX + 'migrated') return;
      let o = null;
      try { o = JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { o = null; }
      if (o && Array.isArray(o.ids)) {
        o.ids.forEach((n) => { if (Number.isFinite(n) && n > 0 && n <= 1025) ids.add(Math.round(n)); });
      }
    });
  } catch (e) { /* 저장소 접근 불가 → 기본 배치 */ }
  return Array.from(ids).sort((a, b) => a - b);
}

/* ---------- 3. 캔버스 텍스처 ---------- */
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  draw(g, w, h);
  return c;
}
function texFrom(canvas) {
  const t = new (window.__THREE.Texture)(canvas);
  t.colorSpace = window.__THREE.SRGBColorSpace;
  t.needsUpdate = true;
  return t;
}
function radialGlowTex(inner, outer, size = 128) {
  return texFrom(canvasTex(size, size, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, inner); gr.addColorStop(1, outer);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }));
}
function heartTex() {
  return texFrom(canvasTex(128, 128, (g, w, h) => {
    g.translate(w / 2, h / 2 + 6);
    g.beginPath();
    const s = 42;
    g.moveTo(0, s * 0.55);
    g.bezierCurveTo(-s * 1.25, -s * 0.35, -s * 0.5, -s * 1.15, 0, -s * 0.42);
    g.bezierCurveTo(s * 0.5, -s * 1.15, s * 1.25, -s * 0.35, 0, s * 0.85);
    g.closePath();
    const gr = g.createLinearGradient(0, -s, 0, s);
    gr.addColorStop(0, '#ffa8d6'); gr.addColorStop(1, '#ff3d8b');
    g.fillStyle = gr; g.fill();
    g.lineWidth = 7; g.strokeStyle = 'rgba(255,255,255,.95)'; g.stroke();
  }));
}
function sparkleTex() {
  return texFrom(canvasTex(96, 96, (g, w, h) => {
    const cx = w / 2, cy = h / 2;
    const gr = g.createRadialGradient(cx, cy, 0, cx, cy, w / 2);
    gr.addColorStop(0, 'rgba(255,255,255,1)');
    gr.addColorStop(.25, 'rgba(255,255,255,.85)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    g.fillStyle = '#fff';
    g.beginPath();
    g.moveTo(cx, cy - 40); g.quadraticCurveTo(cx + 6, cy - 6, cx + 40, cy);
    g.quadraticCurveTo(cx + 6, cy + 6, cx, cy + 40);
    g.quadraticCurveTo(cx - 6, cy + 6, cx - 40, cy);
    g.quadraticCurveTo(cx - 6, cy - 6, cx, cy - 40);
    g.fill();
  }));
}
function shadowTex() {
  return texFrom(canvasTex(128, 128, (g, w, h) => {
    const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2);
    gr.addColorStop(0, 'rgba(20,40,20,.42)');
    gr.addColorStop(.55, 'rgba(20,40,20,.20)');
    gr.addColorStop(1, 'rgba(20,40,20,0)');
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
  }));
}
function cloudTex() {
  return texFrom(canvasTex(256, 128, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    const blobs = [[70, 74, 46], [124, 62, 52], [180, 76, 42], [104, 88, 38], [150, 90, 34]];
    blobs.forEach(([x, y, r]) => {
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(255,255,255,1)');
      gr.addColorStop(.6, 'rgba(255,255,255,.92)');
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    });
  }));
}
function signTex() {
  return texFrom(canvasTex(512, 256, (g, w, h) => {
    g.fillStyle = '#c98a4b'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#dc9d59'; g.fillRect(8, 8, w - 16, h - 16);
    g.strokeStyle = '#8d5a2b'; g.lineWidth = 10; g.strokeRect(10, 10, w - 20, h - 20);
    g.strokeStyle = 'rgba(141,90,43,.35)'; g.lineWidth = 3;

}

/* 지형 높이 함수 (지오메트리 변위와 동일식) */
function terrainY(x, z) {
  const r = Math.hypot(x, z);
  const edge = smoothstep(10, 24, r);
  let y = edge * (1.9 + 0.9 * Math.sin(Math.atan2(z, x) * 3 + 0.7) + 0.45 * Math.sin(x * 0.33));
  const bump = 0.17 * Math.sin(x * 0.55) * Math.cos(z * 0.6) + 0.1 * Math.sin((x + z) * 0.9);
  y += bump * (1 - edge * 0.85);
  const d = Math.hypot(x - POND.x, z - POND.z);
  const dip = smoothstep(POND.r + 1.5, POND.r - 1.1, d);
  y = y * (1 - dip) - 0.62 * dip;
  return y;
}

function makeTree(scale, pink) {
  const g = new THREE.Group();
  const trunkH = rndRange(0.85, 1.3) * scale;
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2 * scale, 0.3 * scale, trunkH, 8),
    new THREE.MeshStandardMaterial({ color: new THREE.Color().setHSL(0.08, 0.42, rndRange(0.26, 0.34)), roughness: 1 })
  );
  trunk.position.y = trunkH / 2;
  trunk.castShadow = true; trunk.receiveShadow = true;
  g.add(trunk);
  const leafHue = pink ? rndRange(0.93, 0.97) : rndRange(0.24, 0.32);
  const leaf = new THREE.MeshStandardMaterial({
    color: new THREE.Color().setHSL(leafHue, pink ? 0.62 : 0.55, pink ? rndRange(0.74, 0.82) : rndRange(0.33, 0.45)),
    roughness: 0.95, flatShading: true,
  });
  const blobs = 4;
  for (let i = 0; i < blobs; i++) {
    const r = (0.78 - i * 0.12) * scale * rndRange(0.92, 1.1);
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), leaf);
    s.position.set(rndRange(-0.26, 0.26) * scale, trunkH + i * 0.3 * scale + rndRange(-0.04, 0.08), rndRange(-0.26, 0.26) * scale);
    s.castShadow = true; s.receiveShadow = true;
    g.add(s);
  }
  return g;
}
const trees = [];

function placeTree(x, z, scale, pink, noShadow) {
  const y = terrainY(x, z);
  const t = makeTree(scale, pink);
  if (noShadow) t.traverse((o) => { if (o.isMesh) o.castShadow = false; });
  t.position.set(x, y, z);
  t.rotation.y = rndRange(0, Math.PI * 2);
  world.add(t);
  trees.push({ obj: t, phase: rndRange(0, 6.28), amp: rndRange(0.006, 0.016) });
  treeSpots.push({ x, z, r: scale * 1.1 });

function makeFence() {
  const g = new THREE.Group();
  const wood = new THREE.MeshStandardMaterial({ color: 0xe0bb82, roughness: 0.9 });
  const R = 10.4;
  const pts = [];
  for (let a = 0.22; a <= Math.PI - 0.22 + 1e-6; a += 0.16) {
    const x = Math.cos(a) * R, z = Math.sin(a) * R;
    pts.push({ x, z, y: terrainY(x, z) });
  }
  pts.forEach((p) => {
    const post = new THREE.Mesh(new THREE.BoxGeometry(0.14, 0.9, 0.14), wood);
    post.position.set(p.x, p.y + 0.45, p.z);
    post.receiveShadow = true;
    g.add(post);
  });
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    const dx = b.x - a.x, dz = b.z - a.z;
    const len = Math.hypot(dx, dz);
    [0.34, 0.68].forEach((hh) => {
      const rail = new THREE.Mesh(new THREE.BoxGeometry(len * 1.02, 0.07, 0.06), wood);
      rail.position.set((a.x + b.x) / 2, (a.y + b.y) / 2 + hh, (a.z + b.z) / 2);
      rail.rotation.y = -Math.atan2(dz, dx);
      g.add(rail);
    });
  }
  return g;
}

function centerSignTex() {
  return texFrom(canvasTex(512, 128, (g, w, h) => {
    g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#f2f8ff'; g.fillRect(0, 0, w, h);
    g.strokeStyle = '#e8484f'; g.lineWidth = 9; g.strokeRect(7, 7, w - 14, h - 14);
    /* 하얀 몬스터볼 마크 */
    const cx = 74, cy = h / 2, R = 42;
    g.beginPath(); g.arc(cx, cy, R, Math.PI, 0); g.closePath();
    g.fillStyle = '#e8484f'; g.fill();
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI); g.closePath();
    g.fillStyle = '#ffffff'; g.fill();
    g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2);
    g.strokeStyle = '#2b2b31'; g.lineWidth = 7; g.stroke();
    g.beginPath(); g.moveTo(cx - R, cy); g.lineTo(cx + R, cy); g.stroke();
    g.beginPath(); g.arc(cx, cy, 13, 0, Math.PI * 2); g.fillStyle = '#ffffff'; g.fill(); g.stroke();
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.fillStyle = '#274a68';
    g.font = '900 52px "Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif';

    g.fillStyle = '#e8484f';
    g.font = '800 21px "Pretendard",sans-serif';
    g.fillText('POKéMON CENTER', 138, h / 2 + 26);
  }));
}

const PROFILE_STORES = ['mpb.profiles.v1', 'hpb.profiles.v1', 'epb.profiles.v1'];
const GENERIC_NAME = /^(첫째|둘째|게스트|아이1|아이2|p1|p2|player\s*1|player\s*2|guest)$/i;
function profileList(key) {
  try {
    const o = JSON.parse(localStorage.getItem(key) || 'null');
    return o && Array.isArray(o.list) ? o.list : [];
  } catch (e) { return []; }
}
function nameFromProfiles(id, fallback) {
  for (const key of PROFILE_STORES) {
    const p = profileList(key).find((x) => x && x.id === id);
    const nm = p && typeof p.name === 'string' ? p.name.trim() : '';
    if (nm && !GENERIC_NAME.test(nm)) return nm.slice(0, 8);
  }
  return fallback;
}

/* 머리 위 이름 배지 */
function nameBadgeTex(name, edge) {
  return texFrom(canvasTex(256, 96, (g, w, h) => {
    g.clearRect(0, 0, w, h);
    const r = 28, x0 = 7, y0 = 5, wid = w - 14, hei = h - 28;
    g.beginPath();
    g.moveTo(x0 + r, y0);
    g.lineTo(x0 + wid - r, y0);
    g.quadraticCurveTo(x0 + wid, y0, x0 + wid, y0 + r);
    g.lineTo(x0 + wid, y0 + hei - r);
    g.quadraticCurveTo(x0 + wid, y0 + hei, x0 + wid - r, y0 + hei);
    g.lineTo(x0 + r, y0 + hei);
    g.quadraticCurveTo(x0, y0 + hei, x0, y0 + hei - r);
    g.lineTo(x0, y0 + r);
    g.quadraticCurveTo(x0, y0, x0 + r, y0);
    g.closePath();
    g.fillStyle = 'rgba(255,255,255,.96)';
    g.fill();
    g.lineWidth = 10; g.strokeStyle = edge; g.stroke();
    g.fillStyle = '#2c441f';
    g.font = '900 40px "Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(name, w / 2, y0 + hei / 2 + 1);
    g.beginPath();
    g.moveTo(w / 2 - 12, h - 24); g.lineTo(w / 2, h - 5); g.lineTo(w / 2 + 12, h - 24);
    g.closePath(); g.fillStyle = edge; g.fill();
  }));
}

/* 걸을 수 있는 자리로 밀어 넣기 (연못·센터·조형물·벤치·마을 경계) */
function clampRWalk(x, z, pad) {
  pad = pad == null ? 0.46 : pad;
  const r = Math.hypot(x, z);
  if (r > 9.2) { const k = 9.2 / Math.max(0.001, r); x *= k; z *= k; }
  const dp = Math.hypot(x - POND.x, z - POND.z);
  if (dp < POND.r + pad) {
    const k = (POND.r + pad) / Math.max(0.001, dp);
    x = POND.x + (x - POND.x) * k; z = POND.z + (z - POND.z) * k;
  }
  const dc = Math.hypot(x - CENTER.x, z - CENTER.z);
  if (dc < CENTER.r + pad) {
    const k = (CENTER.r + pad) / Math.max(0.001, dc);
    x = CENTER.x + (x - CENTER.x) * k; z = CENTER.z + (z - CENTER.z) * k;
  }
  const dm = Math.hypot(x - monPos.x, z - monPos.z);
  if (dm < 1.35) { const k = 1.35 / Math.max(0.001, dm); x = monPos.x + (x - monPos.x) * k; z = monPos.z + (z - monPos.z) * k; }
  const db = Math.hypot(x - benchPos.x, z - benchPos.z);
  if (db < 1.12) { const k = 1.12 / Math.max(0.001, db); x = benchPos.x + (x - benchPos.x) * k; z = benchPos.z + (z - benchPos.z) * k; }
  return { x, z };
}

/* 가족 산책 목적지 고르기 */
const REST_SPOTS = [
  { x: -1.0, z: 6.4 }, { x: 2.9, z: 5.8 }, { x: -3.2, z: -1.6 },
  { x: 3.6, z: 0.2 }, { x: 0.2, z: -3.0 }, { x: 5.2, z: 1.4 }, { x: -4.2, z: 1.0 },
];
function pickPersonSpot(P) {
  for (let i = 0; i < 12; i++) {
    let cand;
    if (rnd() < 0.42) {
      const s = REST_SPOTS[Math.floor(rnd() * REST_SPOTS.length)];
      cand = { x: s.x + rndRange(-0.5, 0.5), z: s.z + rndRange(-0.5, 0.5) };
    } else {
      const a = rndRange(0, Math.PI * 2), rr = rndRange(2.2, 7.6);
      cand = { x: Math.cos(a) * rr, z: Math.sin(a) * rr };
    }
    const c = clampRWalk(cand.x, cand.z, 0.7);
    if (Math.hypot(c.x - P.x, c.z - P.z) < 1.3) continue;
    let crowded = false;
    for (const q of people) {
      if (q !== P && Math.hypot(c.x - q.x, c.z - q.z) < 0.85) { crowded = true; break; }
    }
    if (crowded) continue;
    P.target = c;
    return;
  }
  P.target = null;
}

function stepPerson(P, dt, controlled) {
  let vx = 0, vz = 0;
  const kv = controlled ? 3.0 : 1.22;
  if (controlled) {
    if (keys.size) {
      if (keys.has('arrowleft') || keys.has('a')) vx -= 1;
      if (keys.has('arrowright') || keys.has('d')) vx += 1;
      if (keys.has('arrowup') || keys.has('w')) vz -= 1;
      if (keys.has('arrowdown') || keys.has('s')) vz += 1;
      if (vx || vz) P.target = null;
    } else if (P.target) {
      const dx = P.target.x - P.x, dz = P.target.z - P.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.14) P.target = null;
      else { vx = dx / d; vz = dz / d; }
    }
  } else {
    if (P.rest > 0) {
      P.rest -= dt;
      if (P.rest <= 0) P.target = null;
    }
    if (P.rest <= 0 && !P.target) {
      if (rnd() < 0.3) P.rest = rndRange(1.8, 5.2);
      else pickPersonSpot(P);
    }
    if (P.rest <= 0 && P.target) {
      const dx = P.target.x - P.x, dz = P.target.z - P.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.2) { P.target = null; P.rest = rndRange(1.2, 4.2); }
      else { vx = dx / d; vz = dz / d; }
    }
  }

  if (vx || vz) {
    const len = Math.hypot(vx, vz) || 1;
    vx /= len; vz /= len;
    if (controlled && keys.size) {
      const s = Math.sin(view.theta), c = Math.cos(view.theta);
      const wx = vx * c - vz * s;
      const wz = vx * s + vz * c;
      vx = wx; vz = wz;
    }
    const step = kv * dt;
    const np = clampRWalk(P.x + vx * step, P.z + vz * step, 0.46);
    P.x = np.x; P.z = np.z;
    P.face = Math.atan2(vx, vz);
    P.moving = true;
    P.walkPhase += dt * (controlled ? 9.5 : 7.4);
  } else {
    P.moving = false;
    P.walkPhase = lerp(P.walkPhase, Math.round(P.walkPhase / Math.PI) * Math.PI, Math.min(1, dt * 10));
  }
  P.speed = lerp(P.speed, P.moving ? 1 : 0, Math.min(1, dt * 12));
  P.group.position.set(P.x, terrainY(P.x, P.z), P.z);
  let curFace = P.group.rotation.y;
  const diff = ((P.face - curFace + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
  P.group.rotation.y = curFace + diff * Math.min(1, dt * 12);
  const sw = Math.sin(P.walkPhase) * 0.62 * P.speed;
  P.parts.legL.rotation.x = sw;
  P.parts.legR.rotation.x = -sw;
  P.parts.armL.rotation.x = -sw * 0.75;
  P.parts.armR.rotation.x = sw * 0.75;
  P.group.position.y += Math.abs(Math.sin(P.walkPhase)) * 0.045 * P.speed;
  if (P.wave > 0) {
    P.wave = Math.max(0, P.wave - dt * 0.85);
    const w = Math.sin(performance.now() * 0.012) * 0.9 * P.wave;
    P.parts.armR.rotation.z = -1.9 * P.wave;
    P.parts.armR.rotation.x = w;
  } else {
    P.parts.armR.rotation.z = lerp(P.parts.armR.rotation.z, 0, Math.min(1, dt * 8));
    P.parts.armR.rotation.x = lerp(P.parts.armR.rotation.x, 0, Math.min(1, dt * 6));
  }
  const idle = !P.moving && P.rest > 0;
  P.parts.head.rotation.z = Math.sin(performance.now() * 0.0016 + P.idx) * 0.03 + (idle ? Math.sin(performance.now() * 0.0008 + P.idx) * 0.05 : 0);
  P.parts.head.rotation.y = idle ? Math.sin(performance.now() * 0.0006 + P.idx * 2) * 0.45 : lerp(P.parts.head.rotation.y, 0, Math.min(1, dt * 3));
  if (P.parts.ring.visible) {
    const k = 1 + Math.sin(performance.now() * 0.004) * 0.07;
    P.parts.ring.scale.set(k, k, k);
    P.parts.ring.material.opacity = 0.5 + Math.sin(performance.now() * 0.004) * 0.2;
  }
}

function makeShadow(scale) {

async function spawnPokemons(list) {
  const ids = (list || shownIds).slice();
  const count = ids.length;
  if (!count) return;
  const baseAngle = rndRange(0, Math.PI * 2);
  const texs = await Promise.all(ids.map((id) => loadTexture(POKE_SPRITE(id))));
  for (let i = 0; i < count; i++) {
    const id = ids[i];
    const a = baseAngle + (i / count) * Math.PI * 2 + rndRange(-0.18, 0.18);
    const rad = rndRange(2.9, count > 8 ? 5.7 : 6.9);
    let x = Math.cos(a) * rad, z = Math.sin(a) * rad;
    if (Math.hypot(x - POND.x, z - POND.z) < POND.r + 0.9) {
      x += 3.2; z += 1.2;
    }
    const dc = Math.hypot(x - CENTER.x, z - CENTER.z);
    if (dc < CENTER.r + 1.0) {
      const k = (CENTER.r + 1.5) / Math.max(0.001, dc);
      x = CENTER.x + (x - CENTER.x) * k;
      z = CENTER.z + (z - CENTER.z) * k;
    }
    const tex = texs[i] || fallbackPokeTex(id);
    const aspect = tex.image ? (tex.image.width / tex.image.height) : 1;
    const h = rndRange(1.45, 1.95);
    const w = h * clamp(aspect, 0.7, 1.5);

    const g = new THREE.Group();
    const spr = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.08, depthWrite: true, side: THREE.DoubleSide, toneMapped: false })
    );
    spr.position.y = h / 2 + 0.06;
    spr.userData.pkIndex = i;
    spr.castShadow = false;
    g.add(spr);
    const sh = makeShadow(w * 0.95);
    g.add(sh);
    g.position.set(x, terrainY(x, z), z);
    world.add(g);

    const pk = {
      id, name: nameOf(id), group: g, spr, tex, y0: terrainY(x, z),
      x, z, tx: x, tz: z,
      phase: rndRange(0, 6.28), hopSpeed: rndRange(2.0, 3.1), hopAmp: rndRange(0.16, 0.3),
      speed: rndRange(0.5, 0.95), wait: rndRange(0.5, 3.5), jump: 0, scale: h,
      baseY: 0, shakeT: 0, levT: 0,
    };
    g.userData.pk = pk;
    pokemons.push(pk);
    pokePickables.push(spr);
  }
}

function clearPokemons() {

    world.remove(pk.group);

}

/* Web Audio 회복 멜로디 (음소거 존중) */
let audioCtx = null;
function playHealMelody() {
  if (!soundOn) return;
  duckAudio(1500);
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t0 = audioCtx.currentTime + 0.03;
    const notes = [523.25, 659.25, 783.99, 1046.50, 880.00, 1046.50];
    notes.forEach((f, i) => {
      const st = t0 + i * 0.125;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = i % 2 ? 'sine' : 'triangle';
      osc.frequency.setValueAtTime(f, st);
      gain.gain.setValueAtTime(0.0001, st);
      gain.gain.linearRampToValueAtTime(0.12, st + 0.035);
      gain.gain.exponentialRampToValueAtTime(0.0008, st + 0.52);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(st); osc.stop(st + 0.56);
      /* 위쪽 반짝임 */
      const o2 = audioCtx.createOscillator();
      const g2 = audioCtx.createGain();
      o2.type = 'sine';
      o2.frequency.setValueAtTime(f * 2, st + 0.06);
      g2.gain.setValueAtTime(0.0001, st + 0.06);
      g2.gain.linearRampToValueAtTime(0.03, st + 0.1);
      g2.gain.exponentialRampToValueAtTime(0.0004, st + 0.34);
      o2.connect(g2); g2.connect(audioCtx.destination);
      o2.start(st + 0.06); o2.stop(st + 0.4);
    });
  } catch (e) { /* 소리 실패는 조용히 무시 */ }
}

function typesOf(id) {
  const code = TYPE_TABLE[id];
  if (!code) return [];
  const out = [];
  for (let i = 0; i < code.length; i++) {
    const k = TYPE_LETTERS.indexOf(code[i]);
    if (k >= 0) out.push(TYPE_NAMES[k]);
  }
  return out;
}
const FX_BY_TYPE = {
  '불꽃': 'fire', '물': 'water', '전기': 'electric',
  '풀': 'grass', '벌레': 'grass', '얼음': 'ice',
  '에스퍼': 'mystic', '고스트': 'mystic', '드래곤': 'mystic', '악': 'mystic',
  '페어리': 'cute', '노말': 'cute',

/* 두 타입이면 앞 타입을 먼저 쓰되, 앞이 평범한 타입이면 뒤의 개성 타입을 살린다 */
function fxGroupOf(id) {
  const groups = typesOf(id).map((t) => FX_BY_TYPE[t]).filter(Boolean);
  if (!groups.length) return 'cute';
  if (groups[0] !== 'cute') return groups[0];
  return groups.find((g) => g !== 'cute') || 'cute';
}

function fxRingAt(x, y, z, color, dur, grow, rise) {
  const m = fxRings[fxRingCursor % fxRings.length];
  fxRingCursor++;
  m.visible = true;
  m.position.set(x, y, z);
  m.scale.set(1, 1, 1);
  m.material.color.setHex(color);
  m.material.opacity = 0.85;
  m.userData.t = 0; m.userData.dur = dur; m.userData.grow = grow; m.userData.rise = rise || 0; m.userData.y = y;
}

function fxPush(cx, top, cz, o) {
  const p = FX_POOL[fxCursor % FX_POOL.length];
  fxCursor++;
  p.s.visible = true;
  p.s.material.map = o.map || sparkleMap;
  p.s.material.color.setHex(o.color == null ? 0xffffff : o.color);
  p.s.material.blending = o.normalBlend ? THREE.NormalBlending : THREE.AdditiveBlending;
  p.s.material.rotation = o.rot || 0;
  p.s.position.set(cx + (o.x || 0), top + (o.y || 0), cz + (o.z || 0));
  p.life = 0;
  p.ttl = o.ttl;
  p.vx = o.vx || 0; p.vy = o.vy || 0; p.vz = o.vz || 0;
  p.g = o.g || 0;
  p.spin = o.spin || 0;
  p.base = o.size;
  p.wob = o.wob || 0;
  p.ph = rndRange(0, 6.28);
  p.s.scale.set(o.size, o.size, 1);
  p.s.material.opacity = 1;
}

function updateFxParticles(dt) {
  const now = performance.now() * 0.006;
  FX_POOL.forEach((p) => {
    if (!p.s.visible) return;
    p.life += dt;
    const k = p.life / p.ttl;
    if (k >= 1) { p.s.visible = false; p.s.material.opacity = 0; return; }
    p.vy += p.g * dt;
    p.s.position.x += (p.vx + (p.wob ? Math.sin(now + p.ph) * p.wob : 0)) * dt;
    p.s.position.y += p.vy * dt;
    p.s.position.z += p.vz * dt;
    p.s.material.rotation += p.spin * dt;
    p.s.material.opacity = k < 0.14 ? k / 0.14 : 1 - (k - 0.14) / 0.86;
    const sc = p.base * (0.72 + k * 0.5);
    p.s.scale.set(sc, sc, 1);
  });
  fxRings.forEach((m) => {
    if (!m.visible) return;
    const u = m.userData;
    u.t += dt;
    const k = u.t / u.dur;
    if (k >= 1) { m.visible = false; m.material.opacity = 0; return; }
    const s = 1 + k * u.grow;
    m.scale.set(s, 1, s);
    if (u.rise) m.position.y = u.y + k * u.rise;
    m.material.opacity = (1 - k) * 0.8;
  });
}

const pointers = new Map();
let dragging = false;
let lastPinch = 0;
let moved = 0;
let lastInteract = performance.now();

canvas.addEventListener('pointerdown', (e) => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY, t: performance.now() });
  dragging = pointers.size === 1;
  moved = 0;
  lastPinch = 0;
  canvas.classList.add('dragging');
});
canvas.addEventListener('pointermove', (e) => {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  moved += Math.abs(dx) + Math.abs(dy);
  lastInteract = performance.now();
  if (pointers.size === 1) {
    viewT.theta -= dx * 0.0062;
    viewT.phi = clamp(viewT.phi - dy * 0.0055, 0.28, 1.46);
  } else if (pointers.size === 2) {
    const arr = Array.from(pointers.values());
    const d = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
    if (lastPinch) {
      const k = lastPinch / Math.max(1, d);
      viewT.radius = clamp(viewT.radius * k, 7, 30);
    }
    lastPinch = d;
  }
});
function endPointer(e) {
  const p = pointers.get(e.pointerId);
  pointers.delete(e.pointerId);
  if (pointers.size === 0) canvas.classList.remove('dragging');
  if (p && pointers.size === 0) {
    const dt = performance.now() - p.t;
    if (moved < 12 && dt < 700) tapAt(e.clientX, e.clientY);
  }
  if (pointers.size < 2) lastPinch = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  viewT.radius = clamp(viewT.radius + Math.sign(e.deltaY) * 1.4, 7, 30);
  lastInteract = performance.now();
}, { passive: false });

const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
function tapAt(cx, cy) {
  ndc.set((cx / window.innerWidth) * 2 - 1, -(cy / window.innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
  if (dexModalOpen) return;
  const hitPoke = raycaster.intersectObjects(pokePickables, false);
  if (hitPoke.length) {
    const pk = pokemons[hitPoke[0].object.userData.pkIndex];
    if (pk) { greet(pk); return; }
  }
  const hitCenter = raycaster.intersectObjects(centerPickables, false);
  if (hitCenter.length) { healCenter(); return; }
  const hitWho = raycaster.intersectObjects(personPickables, false);
  if (hitWho.length) {
    const pi = hitWho[0].object.userData.personIdx;
    if (Number.isFinite(pi)) {
      if (pi === activeIdx) { const P = people[pi]; if (P.wave < 0.2) P.wave = 1; }
      else selectPerson(pi);
      return;
    }
  }
  const hitGround = raycaster.intersectObject(ground, false);
  if (hitGround.length) {
    let { x, z } = hitGround[0].point;
    const c = clampRWalk(x, z, 0.5);
    const P = activePerson();
    P.target = c;
    hintFade();
  }
}

    g.textAlign = 'right';

    a.download = `pokemon-ajit-${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}-${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}.png`;

    burstHearts(activePerson().group.position.clone().add(new THREE.Vector3(0, 1.7, 0)), 6);

});

/* ---------- 16-b. 배경음악(BGM)·환경음 ---------- */
/* sd_live/public/audio/*.mp3 (CC0 실음원) — 같은 폴더 기준 상대 경로 → Vercel → GitHub raw 순 폴백 */
const AUDIO_BASES = ['./audio/', 'https://stock-dashboard-live-6frm.vercel.app/audio/', 'https://raw.githubusercontent.com/hwen21c-tech/stock-dashboard-live/main/public/audio/'];
function audioUrls(name) { return AUDIO_BASES.map((b) => b + name + '.mp3'); }
const BGM_VOL = 0.34;
const AMB_VOL = 0.26;
let audioStarted = false;
let duckUntil = 0;
let ambName = 'amb_forest';

function makeLoop(name, onErr) {
  const a = new Audio();
  a.loop = true;
  a.preload = 'none';
  a.volume = 0;
  a.dataset.track = name;
  a.__k = 0;
  a.src = audioUrls(name)[0];
  a.addEventListener('error', () => {
    const urls = audioUrls(a.dataset.track);
    a.__k += 1;
    if (a.__k < urls.length) {
      a.src = urls[a.__k];
      if (audioStarted && soundOn) { const p = a.play(); if (p && p.catch) p.catch(() => {}); }
    } else if (onErr) onErr();
  });
  return a;
}
const bgm = makeLoop('music_village');
const amb = makeLoop('amb_forest');

function playBoth() {
  [bgm, amb].forEach((a) => {
    try {
      a.preload = 'auto';
      const p = a.play();
      if (p && p.catch) p.catch(() => {});
    } catch (e) { /* 자동재생 차단은 다음 터치에서 재시도 */ }
  });
}
function startAudio() {
  if (audioStarted) return;
  audioStarted = true;
  if (!soundOn) return;
  playBoth();
}
/* 첫 터치·클릭·키 입력에서 부드럽게 시작 (모바일 자동재생 정책) */
['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
  window.addEventListener(ev, startAudio, { passive: true });
});

/* 울음소리·회복 멜로디가 나면 BGM을 살짝 낮춘다(덕킹) */
function duckAudio(ms) {
  duckUntil = Math.max(duckUntil, performance.now() + (ms || 1000));
  if (!soundOn || !audioStarted) return;
  /* 프레임이 느린 기기에서도 울음소리와 겹치지 않게 즉시 낮춘다 */
  bgm.volume = Math.min(bgm.volume, BGM_VOL * 0.3);
  amb.volume = Math.min(amb.volume, AMB_VOL * 0.45);
}

function switchAmbience(name) {
  if (ambName === name) return;
  ambName = name;
  const urls = audioUrls(name);
  amb.__k = 0;
  const swap = () => {
    amb.src = urls[0];
    try { amb.load(); } catch (e) { /* */ }
    if (audioStarted && soundOn) {
      const p = amb.play();
      if (p && p.catch) p.catch(() => {});
    }
  };
  if (amb.volume > 0.02) {
    amb.volume = 0;
    setTimeout(swap, 80);
  } else swap();
}

let audioPrevT = performance.now();
function updateAudio() {
  if (!audioStarted) return;
  /* 프레임이 느려도(저사양·소프트웨어 렌더) 실제 시간 기준으로 볼륨을 맞춘다 */
  const now = performance.now();
  const adt = Math.min(0.4, Math.max(0.001, (now - audioPrevT) / 1000));
  audioPrevT = now;
  const ducking = now < duckUntil;
  const tb = soundOn ? (ducking ? BGM_VOL * 0.3 : BGM_VOL) : 0;
  const ta = soundOn ? (ducking ? AMB_VOL * 0.45 : AMB_VOL) : 0;
  bgm.volume = clamp(lerp(bgm.volume, tb, Math.min(1, adt * (ducking ? 14 : 2.4))), 0, 1);
  amb.volume = clamp(lerp(amb.volume, ta, Math.min(1, adt * (ducking ? 14 : 2.2))), 0, 1);
  if (!soundOn && bgm.volume < 0.012 && !bgm.paused) bgm.pause();
  if (!soundOn && amb.volume < 0.012 && !amb.paused) amb.pause();
}

/* ---------- 16. 크기 조절 ---------- */
function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(w, h, false);
  camera.aspect = w / Math.max(1, h);
  camera.fov = camera.aspect < 0.6 ? 58 : camera.aspect < 0.78 ? 52 : 47;
  camera.updateProjectionMatrix();
  if (!userZoomed) viewT.radius = baseRadius();
  view.radius = clamp(view.radius, 7, 30);
}
let userZoomed = false;
canvas.addEventListener('wheel', () => { userZoomed = true; });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 250));
resize();
view.radius = baseRadius();
viewT.radius = baseRadius();

/* ---------- 17. 애니메이션 ---------- */
const clock = new THREE.Clock();
const tmpV = new THREE.Vector3();
const tmpC = new THREE.Color();
const badgeRight = new THREE.Vector3();
const badgeProj = new THREE.Vector3();
const badgeWorld = new THREE.Vector3();
const badgePts = [];
const placedPts = [];

/* 포켓몬 다음 목적지 */
function pickPokeTarget(pk) {
  for (let i = 0; i < 8; i++) {
    const a = rndRange(0, Math.PI * 2), r = rndRange(2.2, 7.4);
    const x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (Math.hypot(x - POND.x, z - POND.z) < POND.r + 1.2) continue;
    if (Math.hypot(x - monPos.x, z - monPos.z) < 1.3) continue;
    if (Math.hypot(x - benchPos.x, z - benchPos.z) < 1.2) continue;
    pk.tx = x; pk.tz = z;
    return;
  }
  pk.tx = pk.x; pk.tz = pk.z;
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  /* 테마 보간 */
  const k = Math.min(1, dt * 2.2);
  ['sunI', 'hemiI', 'ambient', 'moon', 'stars', 'fireflies', 'lamp', 'sunScale', 'fogNear', 'fogFar', 'waterOp', 'waterMetal', 'cloudOp', 'exposure'].forEach((key) => {
    cur[key] = lerp(cur[key], tgt[key], k);
  });
  Object.keys(tgtC).forEach((key) => { curC[key].lerp(tgtC[key], k); });

  skyUniforms.top.value.copy(curC.skyTop);
  skyUniforms.bottom.value.copy(curC.skyBottom);
  scene.fog.color.copy(curC.fog);
  scene.fog.near = cur.fogNear;
  scene.fog.far = cur.fogFar;
  hemi.color.copy(curC.hemiSky);
  hemi.groundColor.copy(curC.hemiGround);
  hemi.intensity = cur.hemiI;
  ambient.intensity = cur.ambient;
  sun.color.copy(curC.sunColor);
  sun.intensity = cur.sunI;
  cur.sunPos = cur.sunPos || tgt.sunPos.slice();
  for (let i = 0; i < 3; i++) cur.sunPos[i] = lerp(cur.sunPos[i], tgt.sunPos[i], Math.min(1, dt * 2.2));
  sun.position.set(cur.sunPos[0], cur.sunPos[1], cur.sunPos[2]);
  cur.glowPos = cur.glowPos || tgt.glowPos.slice();
  for (let i = 0; i < 3; i++) cur.glowPos[i] = lerp(cur.glowPos[i], tgt.glowPos[i], Math.min(1, dt * 2.2));
  sun.target.position.set(0, 0, 0);
  sunSprite.material.color.copy(curC.sunGlow);
  sunSprite.scale.setScalar(cur.sunScale);
  sunSprite.position.set(cur.glowPos[0], cur.glowPos[1], cur.glowPos[2]);
  moonSprite.material.opacity = cur.moon;
  moonShape.material.opacity = cur.moon * 0.95;
  moonSprite.position.set(cur.glowPos[0], cur.glowPos[1], cur.glowPos[2]);
  moonShape.position.set(cur.glowPos[0], cur.glowPos[1], cur.glowPos[2]);
  starMat.opacity = cur.stars;
  ffMat.opacity = cur.fireflies;
  groundMat.color.copy(curC.grassTint);
  waterMat.color.copy(curC.water);
  waterMat.opacity = cur.waterOp;
  waterMat.metalness = cur.waterMetal;
  waterMat.roughness = 0.2;
  renderer.toneMappingExposure = cur.exposure;
  lamps.forEach((l) => {
    l.pl.intensity = cur.lamp * 2.2;
    l.glassMat.emissiveIntensity = 0.18 + cur.lamp * 1.5;
  });
  /* 포켓몬 센터 — 밤에는 창문·간판에 따뜻한 불빛 */
  centerLights.forEach((c) => {
    const v = c.off + (c.on - c.off) * cur.lamp;
    if (c.mat) c.mat.emissiveIntensity = v;
    if (c.pl) c.pl.intensity = v;
  });
  clouds.forEach((c) => { c.material.opacity = cur.cloudOp * 0.9; c.material.color.copy(curC.cloudColor); });

  /* 구름 이동 */
  clouds.forEach((c) => {
    c.position.x += c.userData.v * dt;
    if (c.position.x > 38) c.position.x = -38;
  });

  /* 나무 살랑임 */
  trees.forEach((tr) => {
    tr.obj.rotation.z = Math.sin(t * 0.7 + tr.phase) * tr.amp;
    tr.obj.rotation.x = Math.cos(t * 0.55 + tr.phase) * tr.amp * 0.7;
  });

  /* 물결 */
  ripples.forEach((r) => {
    r.userData.t = (r.userData.t + dt * 0.42) % 1;
    const p = r.userData.t;
    const s = 0.6 + p * 2.4;
    r.scale.set(s, 1, s);
    r.material.opacity = (1 - p) * 0.35;
  });
  glints.forEach((s) => {
    s.material.opacity = 0.25 + 0.75 * Math.abs(Math.sin(t * 1.6 + s.userData.ph)) * (0.35 + cur.stars * 0.4 + 0.3);
  });

  /* 몬스터볼 회전 */
  if (monument.userData.ball) monument.userData.ball.rotation.y += dt * 0.35;

  /* 반딧불 */
  if (cur.fireflies > 0.02) {
    const p = ffGeo.attributes.position;
    for (let i = 0; i < FF_N; i++) {
      const s = ffSeed[i];
      const a = s.a + t * 0.06 * s.sp;
      p.setX(i, Math.cos(a) * s.rr);
      p.setZ(i, Math.sin(a) * s.rr);
      p.setY(i, 0.6 + Math.sin(t * 0.9 * s.sp + s.ph) * 0.6 + 1.2);
    }
    p.needsUpdate = true;
  }

  /* 나비 */
  butterflies.forEach((b) => {
    const u = b.userData;
    u.a += dt * u.sp;
    const x = Math.cos(u.a) * u.rr, z = Math.sin(u.a * 0.9) * u.rr;
    b.position.set(x, terrainY(x, z) + u.y + Math.sin(t * 2 + u.ph) * 0.15, z);
    const s = 0.16 + Math.abs(Math.sin(t * 9 + u.ph)) * 0.1;
    b.scale.set(s, s * 1.15, 1);
  });

  /* 가족 4인 */
  people.forEach((P, i) => stepPerson(P, dt, i === activeIdx));

  /* 포켓몬 */
  pokemons.forEach((pk) => {
    pk.wait -= dt;
    if (pk.wait <= 0) {
      pickPokeTarget(pk);
      pk.wait = rndRange(2.6, 6.5);
    }
    const dx = pk.tx - pk.x, dz = pk.tz - pk.z;
    const d = Math.hypot(dx, dz);
    let moving = 0;
    if (d > 0.15) {
      const step = Math.min(d, pk.speed * dt);
      pk.x += (dx / d) * step;
      pk.z += (dz / d) * step;
      moving = 1;
      pk.phase += dt * pk.hopSpeed * 1.5;
    } else {
      pk.phase += dt * pk.hopSpeed * 0.55;
    }
    if (pk.jump > 0) pk.jump = Math.max(0, pk.jump - dt * 1.6);
    const hop = Math.abs(Math.sin(pk.phase)) * pk.hopAmp * (0.55 + moving * 0.65);
    const extra = Math.sin(pk.jump * Math.PI * 2) * 0.5 * pk.jump;
    pk.group.position.set(pk.x, terrainY(pk.x, pk.z) + hop + extra, pk.z);
    // 빌보드 (카메라를 향함)
    pk.spr.quaternion.copy(camera.quaternion);
    // 통통 튈 때 살짝 늘어나고 줄어드는 느낌
    const sq = 1 + Math.sin(pk.phase * 2) * 0.03 * (0.4 + moving);
    pk.spr.scale.set(1 / sq, sq, 1);
    // 전기 타입: 부르르 떨림
    if (pk.shakeT > 0) {
      pk.shakeT = Math.max(0, pk.shakeT - dt);
      const kn = pk.shakeT / 0.7;
      pk.spr.position.x = Math.sin(t * 62) * 0.11 * kn;
      pk.spr.position.y = pk.scale / 2 + 0.06 + Math.cos(t * 78) * 0.05 * kn;
      pk.spr.material.rotation = Math.sin(t * 45) * 0.06 * kn;
    } else {
      pk.spr.position.x = 0;
      pk.spr.position.y = pk.scale / 2 + 0.06;
    }
    // 에스퍼·고스트·드래곤·악: 공중 부양 + 빙글
    if (pk.levT > 0) {
      pk.levT = Math.max(0, pk.levT - dt);
      const lp = 1 - pk.levT / 1.7;
      pk.group.position.y += Math.sin(Math.min(1, lp * 1.15) * Math.PI) * 0.55;
      pk.spr.material.rotation = pk.levT > 0 ? lp * Math.PI * 1.7 : 0;
    } else if (pk.shakeT <= 0) {
      pk.spr.material.rotation = 0;
    }
    // 그림자는 바닥에 고정
  });

  /* 회복 별가루 */
  healStars.forEach((st) => {
    if (!st.s.visible) return;
    st.life += dt;
    const p = st.life / st.ttl;
    if (p >= 1) { st.s.visible = false; st.s.material.opacity = 0; return; }
    st.s.position.x += st.vx * dt;
    st.s.position.y += st.vy * dt;
    st.s.position.z += st.vz * dt;
    st.vy -= dt * 0.55;
    st.s.material.opacity = 1 - p;
    const sc = st.grow * (0.55 + p * 0.75);
    st.s.scale.set(sc, sc, 1);
    st.s.material.rotation += dt * 1.6;
  });

  /* 센터 회복 링 */
  if (healRingT >= 0 && centerRing) {
    healRingT += dt;
    const p = healRingT / 1.15;
    if (p >= 1) { healRingT = -1; centerRing.material.opacity = 0; centerRing.scale.set(1, 1, 1); }
    else {
      const s2 = 0.9 + p * 2.6;
      centerRing.scale.set(s2, s2, s2);
      centerRing.material.opacity = (1 - p) * 0.85;
    }
  }

  /* 하트 파티클 */
  hearts.forEach((h) => {
    if (!h.s.visible) return;
    h.life += dt;
    const p = h.life / h.ttl;
    if (p >= 1) { h.s.visible = false; h.s.material.opacity = 0; return; }
    h.s.position.y += h.vy * dt;
    h.s.position.x += h.vx * dt;
    h.s.position.z += h.vz * dt;
    h.s.material.opacity = 1 - p;
    const sc = (0.34 + p * 0.25);
    h.s.scale.set(sc, sc, 1);
  });

  /* 카메라 */
  view.theta = lerp(view.theta, viewT.theta, Math.min(1, dt * 9));
  view.phi = lerp(view.phi, viewT.phi, Math.min(1, dt * 9));
  view.radius = lerp(view.radius, viewT.radius, Math.min(1, dt * 6));
  const sp = Math.sin(view.phi), cp = Math.cos(view.phi);
  camera.position.set(
    camSmooth.x + view.radius * sp * Math.sin(view.theta),
    camSmooth.y + view.radius * cp + 0.4,
    camSmooth.z + view.radius * sp * Math.cos(view.theta)
  );
  if (camera.position.y < 0.9) camera.position.y = 0.9;
  camera.lookAt(camSmooth);
  camSmooth.lerp(camTarget, Math.min(1, dt * 4));

  /* 이름 배지 — 카메라 기준으로 좌우로 벌리고, 화면에서 겹치면 위로 밀어 올린다 */
  camera.updateMatrixWorld();
  badgeRight.setFromMatrixColumn(camera.matrixWorld, 0);
  badgePts.length = 0;
  const tanHalf = Math.tan((camera.fov * Math.PI / 180) / 2);
  const halfW = 38;
  people.forEach((P) => {
    const g = P.group.position;
    let bx = g.x + badgeRight.x * P.badgeX;
    let bz = g.z + badgeRight.z * P.badgeX;
    const by = g.y + P.h * 1.98 + P.badgeLift;
    const dist = camera.position.distanceTo(badgeWorld.set(bx, by, bz));
    const wpp = (2 * dist * tanHalf) / Math.max(1, window.innerHeight);
    badgeProj.set(bx, by, bz).project(camera);
    let sx = (badgeProj.x * 0.5 + 0.5) * window.innerWidth;
    const sy = (-badgeProj.y * 0.5 + 0.5) * window.innerHeight;
    /* 화면 밖으로 잘리지 않게 안쪽으로 당긴다 */
    const dpx = sx < halfW ? halfW - sx : (sx > window.innerWidth - halfW ? (window.innerWidth - halfW) - sx : 0);
    if (dpx) {
      bx += badgeRight.x * dpx * wpp;
      bz += badgeRight.z * dpx * wpp;
      sx += dpx;
    }
    badgePts.push({ P, bx, by, bz, lift: 0, sx, sy, wpp });
  });
  badgePts.sort((a, b) => a.sy - b.sy);
  placedPts.length = 0;
  badgePts.forEach((p) => {
    for (let k = 0; k < 4; k++) {
      /* 위로 밀면 화면 y는 작아진다 */
      const hit = placedPts.find((q) => Math.abs(q.sx - p.sx) < 58 && Math.abs(q.sy - (p.sy - p.lift)) < 26);
      if (!hit) break;
      p.lift += 27;
    }
    placedPts.push({ sx: p.sx, sy: p.sy - p.lift });
    p.P.parts.badge.position.set(p.bx, p.by + p.lift * p.wpp, p.bz);
  });

  updateAudio();
  updateFxParticles(dt);
  updateBubbles();
  renderer.render(scene, camera);
}

/* 첫 프레임 준비 후 로딩 감춤 */

/* 디버그/검증용 상태 노출 (읽기 전용) */
window.__AJIT = {
  get ready() { return true; },
  get theme() { return themeName; },

  get healCount() { return healCount; },
  get stars() { return healStars.filter((s) => s.s.visible).length; },
  get pick() { return { p1: pick.p1.slice(), p2: pick.p2.slice() }; },
  get dexIds() { return { p1: dexSlots.p1.ids.slice(), p2: dexSlots.p2.ids.slice() }; },
  get modalOpen() { return dexModalOpen; },
  get audio() {
    return {
      started: audioStarted, soundOn,
      bgm: { track: bgm.dataset.track, vol: +bgm.volume.toFixed(3), paused: bgm.paused, src: bgm.currentSrc || bgm.src, time: +bgm.currentTime.toFixed(2) },
      amb: { track: ambName, vol: +amb.volume.toFixed(3), paused: amb.paused, time: +amb.currentTime.toFixed(2) },
      ducking: performance.now() < duckUntil,
    };
  },
  selectPerson(i) { return selectPerson(i); },
  wakePeople() { people.forEach((P) => { P.rest = 0; }); return true; },
  heal() { return healCenter(); },
  centerScreen() {
    const v = new THREE.Vector3(CENTER.x, CENTER.y + 1.6, CENTER.z).project(camera);
    const out = { x: (v.x * 0.5 + 0.5) * window.innerWidth, y: (-v.y * 0.5 + 0.5) * window.innerHeight, z: v.z };
    return out;
  },
  badgeScreens() {
    return people.map((P) => {
      const v = P.parts.badge.position.clone().project(camera);
      return { name: P.name, x: Math.round((v.x * 0.5 + 0.5) * window.innerWidth), y: Math.round((-v.y * 0.5 + 0.5) * window.innerHeight) };
    });
  },
  personScreen(i) {
    const P = people[i]; if (!P) return null;
    const v = new THREE.Vector3(P.x, P.group.position.y + 1.0, P.z).project(camera);
    return { x: (v.x * 0.5 + 0.5) * window.innerWidth, y: (-v.y * 0.5 + 0.5) * window.innerHeight, name: P.name };
  },
  openDex() { openDexModal(); return { p1: dexSlots.p1.ids.length, p2: dexSlots.p2.ids.length }; },
  closeDex() { closeDexModal(); },
  togglePick(slot, id) { toggleDexTile(slot, id); return { p1: dexDraft.p1.slice(), p2: dexDraft.p2.slice() }; },
  async applyDex() { await new Promise((r) => setTimeout(r, 0)); document.getElementById('dexApply').click(); return true; },
  setPick(p) { pick = { p1: (p.p1 || []).slice(0, MAX_PER_KID), p2: (p.p2 || []).slice(0, MAX_PER_KID) }; writePick(pick); return applyFriends(pick.p1.concat(pick.p2)); },
  get camera() { return { theta: view.theta, phi: view.phi, radius: view.radius }; },
  get hearts() { return hearts.filter((h) => h.s.visible).length; },
  get bubbles() { return bubbles.length; },
  greet(i = 0) { const pk = pokemons[i]; if (pk) greet(pk); return pk ? pk.name : null; },
  typesOf(id) { return typesOf(id); },
  pokeState(i) { const pk = pokemons[i]; if (!pk) return null; return { id: pk.id, shakeT: pk.shakeT, levT: pk.levT, jump: pk.jump }; },
  fxOf(id) { return fxGroupOf(id); },
  get fxParticles() { return FX_POOL.filter((p) => p.s.visible).length; },
  get fxRings() { return fxRings.filter((m) => m.visible).length; },
  screenOf(i) {
    const pk = pokemons[i]; if (!pk) return null;
    const v = pk.group.position.clone(); v.y += pk.scale * 0.5; v.project(camera);
    return { x: (v.x * 0.5 + 0.5) * window.innerWidth, y: (-v.y * 0.5 + 0.5) * window.innerHeight, name: pk.name, id: pk.id };
  },
  tap(x, z) { const P = activePerson(); P.target = { x, z }; return true; },
  setTheme,
  resetView,
  setView(v) {
    if (Number.isFinite(v.theta)) viewT.theta = v.theta;
    if (Number.isFinite(v.phi)) viewT.phi = v.phi;
    if (Number.isFinite(v.radius)) viewT.radius = v.radius;
    if (Number.isFinite(v.y)) { camTarget.y = v.y; camSmooth.y = v.y; }
    return { theta: viewT.theta, phi: viewT.phi, radius: viewT.radius, y: camTarget.y };
  },
  snapView() { view.theta = viewT.theta; view.phi = viewT.phi; view.radius = viewT.radius; },
  moveBy(x, z) { const P = activePerson(); P.x = x; P.z = z; return { x: P.x, z: P.z }; },
};
</script>
</body>
