<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>포켓몬 2인 대결 — 배틀 월드 3탄</title>
<meta name="theme-color" content="#3aa62b">
<meta name="description" content="태블릿 한 화면에서 둘이 함께 — 포켓몬 2인 대결">
<link rel="icon" type="image/svg+xml" href="./pokemon-battle-icon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="./pokemon-battle-icon-180.png">
<link rel="manifest" href="./pokemon/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="./pokemon-battle2.css"><style id="preview-fix">
  /* ==========================================================
     preview-pokemon 전용 — 2인 대전 문제 표시 영역을 크게·선명하게
     (4지선다 .choice 크기는 그대로)
     ========================================================== */
  .qpanel .qbody{
    background:#fff;border:3px solid #9dd977;border-radius:16px;
    margin:3px 0 6px;padding:6px 10px;min-height:52px;
    box-shadow:0 3px 0 rgba(70,120,30,.16),inset 0 1px 0 #fff;
  }
  .qpanel .qbody .qtext{
    font-size:clamp(17px,4.6vw,28px);line-height:1.28;letter-spacing:-.01em;
    white-space:normal;overflow:visible;text-overflow:clip;
    word-break:keep-all;overflow-wrap:anywhere;
  }
  .qpanel .qbody .qemoji{font-size:clamp(20px,5.6vw,30px)}
</style>
<script src="./pokemon-lock.js"></script>
<script src="./pokemon-3rd.js"></script>
<script src="./pokemon-art.js"></script>
<style>
  :root{
    --grass1:#d9f7b0; --grass2:#a8e86b; --grass3:#57bd2f; --deep:#20591a;
    --gold:#ffcf4d; --ink:#22400f; --ink-soft:#4d6b32; --card:#fffdf3; --line:#cfe6a6;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;font-family:"Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:var(--ink);background:linear-gradient(180deg,#bff0ff 0%,#d8f7ff 22%,var(--grass1) 46%,var(--grass2) 72%,var(--grass3) 100%);
    min-height:100dvh;overflow-x:hidden;overscroll-behavior-y:contain;
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(255,255,255,.82);
    border-bottom:2px solid rgba(160,210,120,.7);backdrop-filter:blur(6px)}
  .top h1{margin:0;font-size:clamp(14px,4vw,19px);letter-spacing:-.03em;flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top h1 span{color:#2f7a1f}
  .back{flex:0 0 auto;display:flex;align-items:center;gap:4px;padding:6px 11px;border-radius:999px;text-decoration:none;
    font-size:clamp(10.5px,2.9vw,12px);font-weight:900;color:#2f4a16;background:#fff;border:2px solid var(--line);
    box-shadow:0 2px 0 rgba(60,110,30,.18)}
  .icob{flex:0 0 auto;width:34px;height:32px;border-radius:10px;border:2px solid var(--line);background:#fff;
    font-size:15px;font-weight:900}

  /* ---------- 준비 화면 ---------- */
  .setup{padding:14px 12px calc(24px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}
  .lead{text-align:center;margin:6px 0 14px}
  .lead b{display:block;font-size:clamp(17px,4.8vw,26px);letter-spacing:-.03em}
  .lead span{display:block;margin-top:4px;font-size:clamp(10.5px,2.9vw,13px);font-weight:900;color:#4d6b32}
  .cards{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:760px){ .cards{grid-template-columns:1fr 1fr} }
  .scard{background:linear-gradient(180deg,#fff,#fffdf3);border:2.5px solid var(--line);border-bottom-width:6px;
    border-radius:20px;padding:12px;box-shadow:0 8px 20px rgba(40,90,20,.13)}
  .scard.p2{border-color:#c7d9f7}
  .scard .head{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .scard .tag{font-size:clamp(10px,2.8vw,11.5px);font-weight:900;color:#fff;background:#3fbe2c;
    border-radius:999px;padding:2px 10px}
  .scard.p2 .tag{background:#3d7ff0}
  .scard .nm{font-size:clamp(14px,3.9vw,18px);font-weight:900;letter-spacing:-.02em;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rows{display:grid;gap:8px}
  .row{display:flex;align-items:center;gap:6px}
  .row .lb{flex:0 0 46px;font-size:clamp(9.5px,2.6vw,11px);font-weight:900;color:#6b8547}
  .seg{display:flex;gap:4px;flex:1 1 auto;min-width:0}
  .seg button{flex:1 1 0;min-width:0;padding:6px 2px;border-radius:11px;font-size:clamp(10px,2.8vw,12.5px);
    font-weight:900;background:#f4fbe8;border:1.8px solid #dcebc4;color:#5c7a34;letter-spacing:-.03em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seg button.on{background:linear-gradient(180deg,#d9f7bd,#a8e86b);border-color:#79c94a;color:#1c4a0e;
    box-shadow:0 2px 0 rgba(60,120,30,.22)}
  .prev{display:flex;align-items:center;gap:8px;margin-top:9px;padding:8px 9px;border-radius:14px;
    background:linear-gradient(180deg,#f7fdf0,#eef8dd);border:1.6px solid #e2eecd}
  .prev img{width:44px;height:44px;object-fit:contain;image-rendering:pixelated;flex:0 0 44px}
  .prev .pi{min-width:0;flex:1}
  .prev b{display:block;font-size:clamp(10.5px,2.9vw,12.5px);letter-spacing:-.02em}
  .prev span{display:block;font-size:clamp(9.5px,2.6vw,11px);font-weight:900;color:#6b8547}
  .startwrap{margin:16px auto 0;max-width:520px;text-align:center}
  .startbtn{width:100%;padding:14px;border:none;border-radius:18px;font-size:clamp(16px,4.6vw,21px);font-weight:900;
    color:#fff;background:linear-gradient(180deg,#ffb02e,#e8760a);letter-spacing:-.02em;
    box-shadow:0 6px 0 #a5520a,0 10px 22px rgba(120,60,0,.3)}
  .startbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #a5520a}
  .startbtn[disabled]{filter:grayscale(.65);opacity:.7;box-shadow:0 4px 0 #8b8b7a}
  .hint{margin:8px 0 0;font-size:clamp(10px,2.7vw,12px);font-weight:900;color:#8a4b00;min-height:16px}

  /* ---------- 대결 화면 ---------- */
  #duel{display:none;flex-direction:column;height:calc(100dvh - 50px);min-height:0;
    padding:6px 7px calc(6px + env(safe-area-inset-bottom))}
  #duel.on{display:flex}
  .dhud{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:stretch}
  .hside{min-width:0;background:rgba(255,255,255,.94);border:2px solid var(--line);border-radius:14px;
    padding:5px 8px;box-shadow:0 3px 10px rgba(40,90,20,.14)}
  .hside.p2{text-align:right}
  .hside .l1{display:flex;align-items:center;gap:5px;min-width:0}
  .hside.p2 .l1{justify-content:flex-end}
  .hside .who{font-size:clamp(10px,2.8vw,12px);font-weight:900;color:#2f4a16;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis}
  .hside .pt{font-size:clamp(8.5px,2.3vw,10px);font-weight:900;color:#7d8a63;white-space:nowrap}
  .pips{display:flex;gap:3px;margin-top:4px}
  .hside.p2 .pips{justify-content:flex-end}
  .pips i{flex:1 1 0;max-width:22px;height:9px;border-radius:99px;background:#e6f2d2;border:1px solid #cfe6a6}
  .pips i.on{background:linear-gradient(90deg,#8ce86a,#35b522);border-color:#2ea11c}
  .pips.crit i.on{background:linear-gradient(90deg,#ff9a5c,#e23c1c);border-color:#c02a10}
  .mid{display:grid;place-items:center;padding:0 2px}
  .mid b{font-size:clamp(11px,3vw,15px);font-weight:900;color:#fff;background:#2f7a1f;
    border-radius:999px;padding:4px 8px;box-shadow:0 3px 0 rgba(0,0,0,.2)}

  .field{position:relative;flex:1 1 auto;min-height:132px;margin-top:6px;border-radius:16px;overflow:hidden;
    border:2.5px solid #bfe29a;box-shadow:inset 0 0 24px rgba(20,60,10,.18),0 6px 16px rgba(40,90,20,.16);
    display:flex}
  .half{position:relative;flex:1 1 50%;min-width:0;overflow:hidden}
  .half::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;
    background:linear-gradient(180deg,transparent,rgba(20,60,10,.16))}
  .cut{position:absolute;left:50%;top:0;bottom:0;width:3px;z-index:4;transform:translateX(-50%);
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.9) 20%,rgba(255,255,255,.9) 80%,transparent)}
  .fighter{position:absolute;bottom:10%;left:50%;z-index:3;width:clamp(96px,23vw,180px);
    transform:translateX(-50%);transition:filter .2s}
  .fighter img{width:100%;display:block;image-rendering:pixelated;
    filter:drop-shadow(0 6px 6px rgba(10,40,4,.35))}
  .half.left .fighter img{transform:scaleX(-1)}
  .fighter .fnm{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%);
    font-size:clamp(8.5px,2.4vw,11px);font-weight:900;color:#fff;white-space:nowrap;
    background:rgba(20,50,10,.68);border:1.4px solid rgba(255,255,255,.7);border-radius:999px;
    padding:0 7px;line-height:1.6}
  .fighter.hurt img{animation:vshurt .55s steps(1)}
  @keyframes vshurt{0%{filter:brightness(3) saturate(.2)}40%{filter:brightness(.4)}70%{filter:brightness(2.4)}100%{filter:none}}
  .fighter.jump img{animation:vsjump .55s cubic-bezier(.2,1.5,.4,1)}
  @keyframes vsjump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-26px) scale(1.06)}100%{transform:translateY(0) scale(1)}}
  .fighter.out img{animation:vsout .9s ease-in forwards}
  @keyframes vsout{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.25) translateY(30px) rotate(24deg)}}
  .dmgpop{position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:6;
    font-size:clamp(22px,6.4vw,38px);font-weight:900;color:#fff;letter-spacing:-.02em;
    -webkit-text-stroke:0.08em rgba(70,12,0,.62);
    text-shadow:0 3px 9px rgba(0,0,0,.45),0 0 16px rgba(255,214,120,.85);
    animation:dmgpop .98s cubic-bezier(.2,1.5,.4,1) forwards;pointer-events:none}
  @keyframes dmgpop{0%{opacity:0;transform:translate(-50%,14px) scale(.35) rotate(-9deg)}
    22%{opacity:1;transform:translate(-50%,-8px) scale(1.22) rotate(3deg)}
    46%{transform:translate(-50%,-14px) scale(1)}
    100%{opacity:0;transform:translate(-50%,-46px) scale(.9)}}
  .sebanner{position:absolute;left:50%;top:9%;transform:translateX(-50%);z-index:7;white-space:nowrap;
    font-size:clamp(11px,3.1vw,15px);font-weight:900;color:#fff;padding:3px 12px;border-radius:999px;letter-spacing:-.02em;
    background:linear-gradient(180deg,#ff9a3c,#e6331a);border:2px solid #fff6d6;
    box-shadow:0 4px 14px rgba(120,20,0,.5),0 0 22px rgba(255,180,60,.75);
    animation:sepop .42s cubic-bezier(.2,1.7,.4,1) both}
  @keyframes sepop{from{opacity:0;transform:translate(-50%,-10px) scale(.6)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
  .finish-blast{position:absolute;z-index:8;pointer-events:none;width:18px;height:18px;border-radius:50%;
    border:5px solid #fff;box-shadow:0 0 28px #ffd75e,inset 0 0 18px #ffb347;
    transform:translate(-50%,-50%);animation:blast .8s ease-out forwards}
  @keyframes blast{0%{opacity:1;transform:translate(-50%,-50%) scale(.3)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(16)}}
  .finish-text{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);z-index:9;
    font-size:clamp(20px,6vw,38px);font-weight:900;color:#fff;white-space:nowrap;
    text-shadow:0 3px 0 #b03a00,0 0 18px #ffb347;animation:fintext 1.1s ease-out forwards}
  @keyframes fintext{0%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(-8deg)}
    28%{opacity:1;transform:translate(-50%,-50%) scale(1.18) rotate(3deg)}
    75%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-62%) scale(1.04)}}
  .field.shake{animation:fshake .5s ease-in-out}
  @keyframes fshake{0%,100%{transform:translate(0)}20%{transform:translate(-6px,3px)}
    40%{transform:translate(5px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
  .centerflash{position:fixed;inset:0;z-index:50;pointer-events:none;background:#fff;opacity:0}
  .centerflash.go{animation:cflash .5s ease-out}
  @keyframes cflash{0%{opacity:.85}100%{opacity:0}}

  .qwrap{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
  @media (max-width:700px){
    .qwrap{grid-template-columns:1fr;gap:6px}
    .field{min-height:104px;margin-top:5px}
    .qpanel{padding:5px 7px 6px;border-bottom-width:4px}
    .qbody{padding:3px 2px 2px;min-height:34px}
    .qtext{font-size:clamp(14px,4.1vw,20px)}
    .choice{min-height:37px;padding:3px 3px;border-bottom-width:3px;font-size:clamp(13px,3.6vw,17px)}
    .qtop .qn{font-size:9px}
    .dhud{gap:4px}
    .hside{padding:4px 6px}
    .fighter{width:clamp(84px,21vw,118px);bottom:9%}
  }
  .qpanel{min-width:0;background:linear-gradient(180deg,#fff,#fffdf3);border:2.5px solid var(--line);
    border-bottom-width:5px;border-radius:16px;padding:7px 8px 9px;display:flex;flex-direction:column;
    box-shadow:0 5px 14px rgba(40,90,20,.12)}
  .qpanel.p2{border-color:#c7d9f7}
  .qpanel.cool{opacity:.65}
  .qtop{display:flex;align-items:center;gap:5px;min-width:0}
  .qtop .qn{flex:0 0 auto;font-size:clamp(8.5px,2.4vw,10.5px);font-weight:900;color:#fff;
    background:#3fbe2c;border-radius:999px;padding:1px 7px;white-space:nowrap;
    max-width:44%;overflow:hidden;text-overflow:ellipsis}
  .qpanel.p2 .qtop .qn{background:#3d7ff0}
  .qtop .combo{flex:0 0 auto;font-size:clamp(8.5px,2.4vw,10.5px);font-weight:900;color:#a8560a}
  .tbar{flex:1 1 auto;height:6px;border-radius:99px;background:#e9f3d8;overflow:hidden;min-width:24px}
  .tbar i{display:block;height:100%;width:100%;border-radius:99px;background:linear-gradient(90deg,#8ce86a,#3fbe2c)}
  .tbar i.warn{background:linear-gradient(90deg,#ffcf4d,#e8890a)}
  .tbar i.crit{background:linear-gradient(90deg,#ff8a5c,#e2231c)}
  .qbody{flex:1 1 auto;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 2px 4px;min-height:44px}
  .qemoji{font-size:clamp(22px,6.6vw,34px);line-height:1;flex:0 0 auto}
  .qtext{font-size:clamp(15px,4.4vw,25px);font-weight:900;letter-spacing:-.02em;text-align:center;
    word-break:keep-all;overflow-wrap:anywhere;line-height:1.25}
  .qsub{font-size:clamp(9.5px,2.6vw,11.5px);font-weight:900;color:#7d8a63;text-align:center;margin-top:-2px}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .choice{min-height:42px;padding:6px 4px;border-radius:12px;background:linear-gradient(180deg,#fff,#f4fbe8);
    border:2px solid #dcebc4;border-bottom-width:4px;font-size:clamp(14px,3.9vw,20px);font-weight:900;
    color:#22400f;display:flex;align-items:center;justify-content:center;gap:5px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.02em}
  .choice .n{font-style:normal;font-size:clamp(8.5px,2.4vw,10px);color:#8fa878;flex:0 0 auto}
  .choice:active{transform:translateY(2px)}
  .choice.ok{background:linear-gradient(180deg,#c8f6a6,#7fd94f);border-color:#4fae28;color:#12400a}
  .choice.no{background:linear-gradient(180deg,#ffd0c4,#f09c8a);border-color:#d05a3c;color:#6a1a0a}
  .choice[disabled]{opacity:.9}

  /* ---------- 결과 ---------- */
  .over{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:14px;
    background:rgba(12,36,6,.55);backdrop-filter:blur(3px)}
  .over.on{display:grid}
  .ocard{width:min(430px,100%);max-height:92dvh;overflow:auto;text-align:center;
    background:linear-gradient(180deg,#fffdf3,#f2ffe0);border:3px solid var(--line);border-radius:22px;
    padding:16px 14px;box-shadow:0 18px 40px rgba(10,40,4,.45);animation:cardin .4s cubic-bezier(.2,1.5,.4,1) both}
  @keyframes cardin{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .ocard .cup{font-size:clamp(38px,12vw,56px);line-height:1}
  .ocard h2{margin:6px 0 2px;font-size:clamp(19px,5.4vw,26px);letter-spacing:-.03em}
  .ocard .who{font-size:clamp(11px,3vw,13px);font-weight:900;color:#4d6b32}
  .ocard .picklb{margin:14px 0 8px;font-size:clamp(11px,3vw,13px);font-weight:900;color:#8a4b00}
  .picks{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .pick{display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 6px;border-radius:16px;
    background:linear-gradient(180deg,#fff,#f6fbea);border:2.5px solid #dcebc4;border-bottom-width:5px;
    font-size:clamp(10.5px,2.9vw,12.5px);font-weight:900;letter-spacing:-.02em}
  .pick .em{font-size:clamp(24px,7vw,32px);line-height:1}
  .pick:active{transform:translateY(2px)}
  .pick[disabled]{opacity:.55}
  .got{margin-top:12px;padding:10px;border-radius:14px;background:#eef8dd;border:1.6px solid #cfe6a6;
    font-size:clamp(11px,3vw,13px);font-weight:900;color:#2f4a16;display:none}
  .got.on{display:block}
  .after{display:none;gap:8px;margin-top:12px;grid-template-columns:1fr 1fr}
  .after.on{display:grid}
  .after button{padding:11px 6px;border-radius:14px;font-size:clamp(11.5px,3.1vw,13.5px);font-weight:900;
    background:#fff;border:2.5px solid var(--line);border-bottom-width:5px}
  .after button.main{background:linear-gradient(180deg,#a8e86b,#57bd2f);border-color:#3f9b22;color:#0f3a06}
  .footnote{margin:10px 0 0;font-size:clamp(9.5px,2.6vw,11px);font-weight:900;color:#7d8a63}

  /* ---------- 5탄: 대결 방식 2가지 · 5라운드 블라인드 픽 ---------- */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:0 auto 12px;max-width:660px}
  @media (max-width:470px){ .modes{grid-template-columns:1fr} }
  .modes button{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 11px;
    border-radius:15px;background:linear-gradient(180deg,#fff,#f6fbea);border:2.5px solid #dcebc4;
    border-bottom-width:5px;text-align:left}
  .modes button b{font-size:clamp(12px,3.5vw,15px);letter-spacing:-.02em;color:#22400f}
  .modes button span{font-size:clamp(9px,2.5vw,10.5px);font-weight:900;color:#6b8547;line-height:1.32}
  .modes button.on{background:linear-gradient(180deg,#fff8e4,#ffe9a8);border-color:#e8b93c}
  .modes button.on b{color:#7a3c00}
  .qpanel{position:relative}
  .qpanel.picking .qbody,.qpanel.picking .choices{display:none}
  .qpanel.picking{min-height:clamp(124px,19dvh,182px)}
  .ppick{display:flex;flex-direction:column;gap:4px;min-height:0}
  .ppick[hidden]{display:none}
  .ppickh{font-size:clamp(8.5px,2.5vw,10.5px);font-weight:900;color:#8a4b00;text-align:center;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ppickg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;overflow:auto;
    max-height:min(170px,23dvh);-webkit-overflow-scrolling:touch}
  .ppickg .pc{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px;border-radius:10px;
    background:#fff;border:2px solid #e2eecd;border-bottom-width:3px;
    font-size:clamp(7.5px,2vw,9px);font-weight:900;letter-spacing:-.03em;color:#33501a;overflow:hidden}
  .ppickg .pc img{width:34px;height:34px;object-fit:contain;image-rendering:pixelated}
  .ppickg .pc span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
(function () {
  'use strict';

  /* ---------- 작은 도구 ---------- */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pickOf = (arr) => arr[Math.floor(Math.random() * arr.length)];
  const shuffle = (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i -= 1) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* */ } };
  const SPR = (id) => 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/' + id + '.png';
  const CRY = (id) => 'https://raw.githubusercontent.com/PokeAPI/cries/main/cries/pokemon/latest/' + id + '.ogg';
  const ART = (id) => 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/' + id + '.png';

  const SLOTS = [
    { k: 'p1', fb: '첫째', emoji: '👧' },
    { k: 'p2', fb: '둘째', emoji: '🧒' },
    { k: 'guest', fb: '게스트', emoji: '🧪' },
  ];
  const SUBS = [
    { k: 'math', name: '⚡ 산수' },
    { k: 'hangul', name: '📖 한글' },
    { k: 'english', name: '🔤 영어' },
  ];
  const DIFFS = [
    { k: 'easy', name: '쉬움' },
    { k: 'mid', name: '중간' },
    { k: 'hard', name: '어려움' },
  ];
  const THEME_OF = {
    '물': 'lake', '얼음': 'lake', '불꽃': 'volcano', '드래곤': 'volcano',
    '전기': 'power', '강철': 'power', '에스퍼': 'ruins', '고스트': 'ruins', '악': 'ruins',
    '바위': 'canyon', '땅': 'canyon', '격투': 'canyon', '비행': 'sky', '페어리': 'sky',
    '풀': 'forest', '벌레': 'forest', '독': 'forest', '노말': 'forest',
  };
  const PROJ = {
    '물': 'water', '불꽃': 'fire', '전기': 'elec', '풀': 'grass', '얼음': 'ice',
    '독': 'poison', '페어리': 'fairy', '에스퍼': 'psychic', '고스트': 'ghost', '악': 'dark',
    '드래곤': 'dragon', '강철': 'steel', '격투': 'fight', '비행': 'flying',
    '땅': 'ground', '바위': 'rock', '벌레': 'bug', '노말': 'normal',
  };

  /* ---------- 소리 ---------- */
  const Sfx = {
    ctx: null,
    muted: lsGet('pkm.mute.v1', false) === true,
    ensure() {
      if (this.muted) return null;
      try {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (this.ctx.state === 'suspended') this.ctx.resume();
        return this.ctx;
      } catch (e) { return null; }
    },
    tone(f, d, type, v, f2) {
      const ctx = this.ensure();
      if (!ctx) return;
      try {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = type || 'triangle';
        o.frequency.setValueAtTime(f, ctx.currentTime);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + (d || 0.12));
        g.gain.setValueAtTime(0.0001, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(v || 0.06, ctx.currentTime + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + (d || 0.12));
        o.connect(g).connect(ctx.destination);
        o.start();
        o.stop(ctx.currentTime + (d || 0.12) + 0.02);
      } catch (e) { /* */ }
    },
    click() { this.tone(660, 0.06, 'square', 0.035, 880); },
    correct() { this.tone(880, 0.09, 'square', 0.06, 1320); },
    wrong() { this.tone(220, 0.18, 'sawtooth', 0.05, 120); },
    hit(type) {
      const f = { '전기': 1200, '불꽃': 320, '물': 560, '풀': 760, '얼음': 900 }[type] || 500;
      this.tone(f, 0.12, 'triangle', 0.06, f * 1.6);
    },
    fanfare() {
      [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => this.tone(f, 0.22, 'triangle', 0.07), i * 130));
    },
    cry(id) {
      if (this.muted) return;
      try {
        const a = new Audio(CRY(id));
        a.volume = 0.5;
        const pr = a.play();
        if (pr && pr.catch) pr.catch(() => { /* */ });
      } catch (e) { /* */ }
    },
  };

  /* ============================================================
     배경음악 — public/audio/*.mp3 (전곡 CC0, 출처는 public/audio/CREDITS.md)
     · AudioBuffer 루프로 재생해 파일 끝에서 끊기지 않고 이어진다.
     · 소리는 모두 master gain 을 지나므로 🔊/🔇 하나로 효과음과 함께 꺼진다.
     · 자동재생 정책 때문에 첫 터치 전에는 조용히 대기하고, 터치 순간 시작한다.
     · 파일을 못 받아도 게임은 그대로 진행된다(조용해질 뿐).
     ============================================================ */
  const BGM = {
    ctx: null, master: null, analyser: null, meterBuf: null,
    files: {}, loading: {}, src: null, ambSrc: null,
    musicName: '', ambName: '', wantMusic: '', wantAmb: '',
    level: 0, meterT: 0, unlocked: false,
    MUSIC_VOL: 0.62, AMB_VOL: 0.3,
    AMB_GAIN: { amb_forest: 1.25, amb_wind: 0.9 },
    url(name) { return './audio/' + name + '.mp3'; },
    ensure() {
      try {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          this.ctx = new AC();
          this.master = this.ctx.createGain();
          this.master.gain.value = Sfx.muted ? 0 : 1;
          this.analyser = this.ctx.createAnalyser();
          this.analyser.fftSize = 1024;
          this.master.connect(this.analyser);
          this.analyser.connect(this.ctx.destination);
          this.meterBuf = new Uint8Array(this.analyser.fftSize);
        }
        if (this.ctx.state === 'suspended') { try { this.ctx.resume(); } catch (e) { /* */ } }
        return this.ctx;
      } catch (e) { return null; }
    },
    /* 첫 터치 — 음소거 상태면 컨텍스트를 만들지 않고, 해제되면 그때 깨운다 */
    unlock() {
      if (Sfx.muted) return;
      const ctx = this.ensure();
      if (!ctx) return;
      this.unlocked = true;
      if (this.wantMusic && !this.src) this.startMusic(this.wantMusic);
      if (this.wantAmb && !this.ambSrc) this.startAmb(this.wantAmb);
    },
    load(name) {
      const ctx = this.ensure();
      if (!ctx) return Promise.resolve(null);
      if (this.files[name]) return Promise.resolve(this.files[name]);
      if (this.loading[name]) return this.loading[name];
      const url = this.url(name);
      this.loading[name] = fetch(url, { cache: 'force-cache' })
        .then((r) => { if (!r.ok) throw new Error(r.status + ' ' + url); return r.arrayBuffer(); })
        .then((buf) => new Promise((res, rej) => {
          const p = ctx.decodeAudioData(buf, res, rej);
          if (p && typeof p.then === 'function') p.then(res, rej);
        }))
        .then((b) => {
          const t = this.trimBuffer(b);
          this.files[name] = t;
          delete this.loading[name];
          /* 받자마자, 기다리던 곡이면 바로 건다(이미 다른 곡이 흐르고 있어도 갈아 끼운다) */
          if (name === this.wantMusic && this.unlocked && !Sfx.muted) this.startMusic(name);
          if (name === this.wantAmb && this.unlocked && !Sfx.muted) this.startAmb(name);
          return t;
        })
        .catch((e) => {
          delete this.loading[name];
          console.warn('[BGM] 음원 로드 실패:', url, e && e.message);
          return null;
        });
      return this.loading[name];
    },
    /* MP3 인코더가 붙인 수십 샘플 패딩만 잘라 내고, 실제 무음 구간은 건드리지 않는다 */
    trimBuffer(buf) {
      try {
        const ctx = this.ctx;
        if (!ctx || !buf) return buf;
        const ch0 = buf.getChannelData(0);
        const n = buf.length;
        let s = 0; let e = n - 1;
        const TH = 0.0008;
        while (s < n && Math.abs(ch0[s]) < TH) s += 1;
        while (e > 0 && Math.abs(ch0[e]) < TH) e -= 1;
        if (s > 256 || (n - 1 - e) > 256) return buf;   /* 진짜 무음이면 그대로 둔다 */
        if (s === 0 && e === n - 1) return buf;
        const len = e - s + 1;
        const out = ctx.createBuffer(buf.numberOfChannels, len, buf.sampleRate);
        for (let c = 0; c < buf.numberOfChannels; c += 1) {
          out.getChannelData(c).set(buf.getChannelData(c).subarray(s, e + 1));
        }
        return out;
      } catch (err) { return buf; }
    },
    music(name) {
      if (!name) return;
      this.wantMusic = name;
      if (!this.unlocked || Sfx.muted) return;   /* 첫 터치 전에는 대기 */
      this.startMusic(name);
    },
    startMusic(name) {
      const ctx = this.ensure();
      if (!ctx) return false;
      const buf = this.files[name];
      if (!buf) { this.load(name); return false; }
      if (this.src && this.musicName === name) return true;
      if (this.src) { const old = this.src; this.src = null; this.fadeSrc(old, 0.9); }
      const now = ctx.currentTime;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(this.MUSIC_VOL, now + 1.2);
      g.connect(this.master);
      const s = ctx.createBufferSource();
      s.buffer = buf;
      s.loop = true;
      s.connect(g);
      s.start(now);
      this.src = { node: s, gain: g, name };
      this.musicName = name;
      if (!this.meterT) this.meterT = setInterval(() => this.meter(), 200);
      return true;
    },
    stopMusic(fade) {
      const rec = this.src;
      this.src = null;
      this.musicName = '';
      this.wantMusic = '';
      if (rec) this.fadeSrc(rec, fade == null ? 0.8 : fade);
    },
    amb(name) {
      this.wantAmb = name || '';
      if (!name) { this.stopAmb(1.2); return; }
      if (!this.unlocked || Sfx.muted) return;
      this.startAmb(name);
    },
    startAmb(name) {
      const ctx = this.ensure();
      if (!ctx) return false;
      const buf = this.files[name];
      if (!buf) { this.load(name); return false; }
      if (this.ambSrc && this.ambName === name) return true;
      if (this.ambSrc) { const old = this.ambSrc; this.ambSrc = null; this.fadeSrc(old, 1.6); }
      const now = ctx.currentTime;
      const g = ctx.createGain();
      const peak = this.AMB_VOL * (this.AMB_GAIN[name] || 1);
      g.gain.setValueAtTime(0.0001, now);
      g.gain.linearRampToValueAtTime(peak, now + 2.2);
      g.connect(this.master);
      const s = ctx.createBufferSource();
      s.buffer = buf;
      s.loop = true;
      s.connect(g);
      s.start(now);
      this.ambSrc = { node: s, gain: g, name };
      this.ambName = name;
      return true;
    },
    stopAmb(fade) {
      const rec = this.ambSrc;
      this.ambSrc = null;
      this.ambName = '';
      if (rec) this.fadeSrc(rec, fade == null ? 1.2 : fade);
    },
    fadeSrc(rec, fade) {
      const ctx = this.ctx;
      if (!ctx || !rec) return;
      const t = ctx.currentTime;
      try {
        if (fade > 0) {
          const g = rec.gain.gain;
          g.cancelScheduledValues(t);
          g.setValueAtTime(g.value, t);
          g.linearRampToValueAtTime(0.0001, t + fade);
          rec.node.stop(t + fade + 0.05);
        } else {
          rec.node.stop(t + 0.01);
        }
      } catch (e) { /* */ }
    },
    /* 🔊/🔇 — 효과음(Sfx)과 같은 스위치를 따른다 */
    setMuted(m) {
      if (!this.master) {
        if (!m) this.unlock();
        return;
      }
      const ctx = this.ctx;
      const t = ctx.currentTime;
      const g = this.master.gain;
      try {
        g.cancelScheduledValues(t);
        g.setValueAtTime(g.value, t);
        g.linearRampToValueAtTime(m ? 0.0001 : 1, t + 0.25);
      } catch (e) { /* */ }
      if (!m) this.unlock();
    },
    meter() {
      if (!this.analyser || !this.ctx) { this.level = 0; return; }
      const b = this.meterBuf;
      this.analyser.getByteTimeDomainData(b);
      let s = 0;
      for (let i = 0; i < b.length; i += 1) { const v = (b[i] - 128) / 128; s += v * v; }
      this.level = Math.sqrt(s / b.length);
    },
    state() {
      return {
        unlocked: this.unlocked,
        muted: !!Sfx.muted,
        ctx: this.ctx ? this.ctx.state : 'none',
        music: this.musicName,
        amb: this.ambName,
        wantMusic: this.wantMusic,
        wantAmb: this.wantAmb,
        loaded: Object.keys(this.files),
        level: Math.round((this.level || 0) * 1000) / 1000,
        musicGain: this.src ? Math.round(this.src.gain.gain.value * 100) / 100 : null,
        ambGain: this.ambSrc ? Math.round(this.ambSrc.gain.gain.value * 100) / 100 : null,
        masterGain: this.master ? Math.round(this.master.gain.value * 1000) / 1000 : null,
      };
    },
  };

  /* 자동재생 정책 — 터치가 올 때마다 깨워 본다(한 번에 안 되면 다음 터치에) */
  ['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
    try { window.addEventListener(ev, () => BGM.unlock(), { passive: true }); } catch (e) { /* */ }
  });

  /* 라운드별 배경음악 — 마지막 5라운드이거나 한 대만 더 맞으면 끝나는 매치포인트에서 보스 곡 */
  function musicForRound() {
    const a = D.s.p1;
    const b = D.s.p2;
    const matchPoint = D.round >= MAXROUND || (!!a && !!b && Math.min(a.hp, b.hp) <= 1);
    return matchPoint ? 'music_boss' : 'music_battle';
  }

  /* ---------- 데이터 ---------- */
  const DB = { list: [], byId: {} };
  const BANK = { hangul: [], english: [], sentences: [] };
  let POK3 = window.POK3 || null;

  function profileName(slot, game) {
    const key = { math: 'mpb.profiles.v1', hangul: 'hpb.profiles.v1', english: 'epb.profiles.v1' }[game];
    const o = lsGet(key, null);
    const list = (o && Array.isArray(o.list)) ? o.list : [];
    const want = slot === 'guest' ? 'p3' : slot === 'p1' ? 'p1' : 'p2';
    const p = list.find((x) => x && x.id === want);
    return (p && p.name) || '';
  }
  function slotName(slot) {
    const nm = profileName(slot, 'math') || profileName(slot, 'english') || profileName(slot, 'hangul');
    if (nm) return nm.slice(0, 8);
    return (SLOTS.find((s) => s.k === slot) || {}).fb || '친구';
  }
  function dexIds(slot) {
    const o = lsGet('pkm.shared.dex.v1.' + slot, null);
    return o && Array.isArray(o.ids) ? o.ids.filter((n) => Number.isFinite(n)) : [];
  }
  function partnerId(slot) {
    const ids = dexIds(slot);
    const raw = lsGet('pkm.partner.v1.' + slot, 0);
    const id = Number(raw);
    if (id && ids.indexOf(id) >= 0) return id;
    return ids.length ? ids[0] : 0;
  }
  function byId(id) { return DB.byId[id] || null; }
  function cfgOf(slot) {
    const saved = lsGet('pkm.versus.cfg.v1.' + slot, null);
    const def = { subj: 'math', diff: 'mid' };
    if (saved && typeof saved === 'object') {
      return {
        subj: SUBS.some((s) => s.k === saved.subj) ? saved.subj : def.subj,
        diff: DIFFS.some((d) => d.k === saved.diff) ? saved.diff : def.diff,
      };
    }
    return def;
  }

  /* ---------- 문제 만들기 ---------- */
  function uniqChoices(ans, makers, n) {
    const out = [ans];
    let guard = 0;
    while (out.length < (n || 4) && guard < 90) {
      guard += 1;
      const c = makers(out);
      if (c == null) continue;
      const s = String(c);
      if (s !== String(ans) && out.every((x) => String(x) !== s)) out.push(s);
    }
    while (out.length < (n || 4)) out.push(String(Number(ans) + out.length + 1));
    return shuffle(out.map(String));
  }

  /* bump: 상성 불리 보정 — 같은 연산·같은 규칙이되 수 범위를 한 단계 키운다(1 → 1.5단계) */
  function mathQ(diff, bump) {
    let a, b, ans, text;
    const K = bump ? 1.4 : 1;
    const up = (n) => Math.max(1, Math.round(n * K));
    if (diff === 'easy') {
      if (Math.random() < 0.5) { a = rnd(1, up(9)); b = rnd(1, up(9)); ans = a + b; text = a + ' + ' + b + ' = ?'; }
      else { a = rnd(3, up(15)); b = rnd(1, a); ans = a - b; text = a + ' − ' + b + ' = ?'; }
    } else if (diff === 'mid') {
      const t = Math.random();
      if (t < 0.34) { a = rnd(up(12), up(89)); b = rnd(up(6), up(60)); ans = a + b; text = a + ' + ' + b + ' = ?'; }
      else if (t < 0.68) { a = rnd(up(30), up(99)); b = rnd(up(4), up(29)); ans = a - b; text = a + ' − ' + b + ' = ?'; }
      else { a = rnd(bump ? 4 : 2, 9); b = rnd(bump ? 4 : 2, 9); ans = a * b; text = a + ' × ' + b + ' = ?'; }
    } else {
      const t = Math.random();
      if (t < 0.4) { a = rnd(up(12), up(49)); b = rnd(bump ? 5 : 2, 9); ans = a * b; text = a + ' × ' + b + ' = ?'; }
      else if (t < 0.75) { b = rnd(bump ? 5 : 2, 9); ans = rnd(up(3), up(12)); a = b * ans; text = a + ' ÷ ' + b + ' = ?'; }
      else { a = rnd(up(10), up(40)); b = rnd(up(5), up(30)); const c = rnd(up(2), up(20)); ans = a + b - c; text = a + ' + ' + b + ' − ' + c + ' = ?'; }
    }
    const choices = uniqChoices(ans, (cur) => {
      const delta = rnd(1, diff === 'easy' ? 4 : 12) * (Math.random() < 0.5 ? -1 : 1);
      const v = Number(ans) + delta;
      return v >= 0 && Math.abs(v - Number(ans)) <= 30 && cur.indexOf(String(v)) < 0 ? v : null;
    });
    return { prompt: text, emoji: '⚡', sub: '', ans: String(ans), choices };
  }

  const LEVEL_UP = { easy: 'mid', mid: 'hard', hard: 'hard' };

  function hangulQ(diff, bump) {
    const lv = bump ? (LEVEL_UP[diff] || diff) : diff;
    const pool = BANK.hangul.filter((w) => w && w.w && w.w.length >= 2 && (w.level || 'mid') === lv);
    const fallback = BANK.hangul.filter((w) => w && w.w && w.w.length >= 2);
    const src = pool.length >= 4 ? pool : fallback;
    if (!src.length) return mathQ(diff, bump);
    const it = pickOf(src);
    const chars = Array.from(it.w);
    const at = rnd(0, chars.length - 1);
    const ansCh = chars[at];
    const shown = chars.map((c, i) => (i === at ? '○' : c)).join('');
    const pool2 = [];
    BANK.hangul.forEach((w) => {
      if (!w || !w.w || w.w === it.w) return;
      Array.from(w.w).forEach((c) => { if (c !== ansCh && pool2.indexOf(c) < 0 && !/[○\s]/.test(c)) pool2.push(c); });
    });
    const choices = uniqChoices(ansCh, () => (pool2.length ? pickOf(pool2) : null));
    return { prompt: shown, emoji: it.e || '📖', sub: '빈칸에 들어갈 글자는?', ans: ansCh, choices };
  }

  function englishQ(diff, bump) {
    const lv = bump ? (LEVEL_UP[diff] || diff) : diff;
    if (lv === 'hard' && BANK.sentences.length) {
      const pool = BANK.sentences.filter((s) => (s.level || 'mid') === lv);
      const src = pool.length ? pool : BANK.sentences;
      const it = pickOf(src);
      const ans = String(it.a);
      const opts = [ans].concat((it.o || []).map(String));
      const uniq = [];
      opts.forEach((o) => { if (uniq.indexOf(o) < 0) uniq.push(o); });
      while (uniq.length < 4) uniq.push(String(Math.random()).slice(2, 4));
      return { prompt: it.q, emoji: '🔤', sub: it.k || '빈칸에 알맞은 말은?', ans, choices: shuffle(uniq) };
    }
    const pool = BANK.english.filter((w) => w && w.en && (w.level || 'mid') === lv);
    const src = pool.length >= 4 ? pool : BANK.english;
    if (!src.length) return mathQ(diff, bump);
    const it = pickOf(src);
    const ans = String(it.en);
    const choices = uniqChoices(ans, () => {
      const o = pickOf(src);
      return o && o.en && o.en !== ans ? o.en : null;
    });
    return { prompt: it.ko || it.en, emoji: it.e || '🔤', sub: '알맞은 영어 단어는?', ans, choices };
  }

  function makeQ(side) {
    const cfg = side.cfg;
    const bump = !!side.bump;
    try {
      if (cfg.subj === 'hangul') return hangulQ(cfg.diff, bump);
      if (cfg.subj === 'english') return englishQ(cfg.diff, bump);
      return mathQ(cfg.diff, bump);
    } catch (e) {
      return mathQ(cfg.diff, bump);
    }
  }

  /* ---------- 화면: 준비 ---------- */
  function paintSetup() {
    const host = $('#cards');
    host.innerHTML = ['p1', 'p2'].map((slot) => {
      const cfg = cfgOf(slot);
      const nm = slotName(slot);
      const ids = dexIds(slot);
      const pid = partnerId(slot);
      const p = pid ? byId(pid) : null;
      return '<div class="scard ' + slot + '" data-side="' + slot + '">'
        + '<div class="head"><span class="tag">' + (slot === 'p1' ? '플레이어 1' : '플레이어 2') + '</span>'
        + '<span class="nm">' + nm + '</span></div>'
        + '<div class="rows">'
        + '<div class="row"><span class="lb">누구?</span><span class="seg" data-k="slot">'
        + SLOTS.map((s) => '<button data-v="' + s.k + '" class="' + (s.k === slot ? 'on' : '') + '">'
          + s.emoji + ' ' + slotName(s.k) + '</button>').join('')
        + '</span></div>'
        + '<div class="row"><span class="lb">과목</span><span class="seg" data-k="subj">'
        + SUBS.map((s) => '<button data-v="' + s.k + '" class="' + (s.k === cfg.subj ? 'on' : '') + '">' + s.name + '</button>').join('')
        + '</span></div>'
        + '<div class="row"><span class="lb">난이도</span><span class="seg" data-k="diff">'
        + DIFFS.map((s) => '<button data-v="' + s.k + '" class="' + (s.k === cfg.diff ? 'on' : '') + '">' + s.name + '</button>').join('')
        + '</span></div>'
        + '</div>'
        + '<div class="prev">'
        + (p
          ? '<img src="' + SPR(p.id) + '" alt=""><span class="pi"><b>' + p.name + '</b>'
            + '<span>' + (p.types || []).join(' · ') + ' · 도감 ' + ids.length + '마리</span></span>'
          : '<img src="' + SPR(25) + '" alt=""><span class="pi"><b>연습 피카츄</b>'
            + '<span>아직 잡은 포켓몬이 없어 연습 파트너로 나가요</span></span>')
        + '</div></div>';
    }).join('');

    validate();
  }

  /* 선택된 슬롯 추적 (기본은 화면 자리 그대로) — D.chosen 은 상태 객체 안에서 초기화된다 */

  function validate() {
    const hint = $('#setHint');
    const btn = $('#startBtn');
    const same = D.chosen.p1 === D.chosen.p2;
    btn.disabled = same;
    if (same) hint.textContent = '두 사람이 같은 친구를 골랐어요. 한 명을 바꿔 주세요!';
    else hint.textContent = '';
  }


  /* ---------- 대결 상태 (5라운드 · ⚡스피드 / ⏱️턴제) ---------- */
  const MAXHP = 5;
  const MAXROUND = 5;
  const DEFAULT_POOL = [1, 4, 7, 25, 133, 152];
  const D = {
    on: false, over: false,
    mode: 'speed',
    round: 1,
    s: { p1: null, p2: null },
    pick: { p1: 0, p2: 0 },
    lock: { p1: false, p2: false },
    adv: { p1: false, p2: false },
    tpos: 'p1',
    chosen: { p1: 'p1', p2: 'p2' },
    history: [],
    winner: null,
  };

  function num(pos) { return pos === 'p1' ? '1' : '2'; }
  /* 받침에 맞는 조사 — '하린가' 같은 어색한 말이 나오지 않게 */
  function josa(name, pair) {
    const t = String(name || '').trim();
    const c = t ? t.charCodeAt(t.length - 1) - 0xAC00 : -1;
    const hasJong = c >= 0 && c <= 11171 && (c % 28) !== 0;
    const p = pair || '이가';
    return t + (hasJong ? p.charAt(0) : p.charAt(1));
  }
  function pan(pos) { return document.getElementById('qp' + num(pos)); }
  function el2(id) { return document.getElementById(id); }
  function other(side) { return side.pos === 'p1' ? D.s.p2 : D.s.p1; }
  function sideOf(pos) { return D.s[pos]; }
  function setHintBar(t) { const h = el2('hintBar'); if (h) h.textContent = t || ''; }

  function makeSide(slot, cfg, pos) {
    const ids = dexIds(slot);
    return {
      pos, slot, cfg,
      practice: !ids.length,
      name: slotName(slot),
      pool: (ids.length ? ids.slice() : DEFAULT_POOL.slice()),
      partner: null,
      hp: MAXHP,
      q: null,
      locked: false,
      timer: 0,
      tleft: 30,
      combo: 0,
      right: 0,
      wrong: 0,
      bump: false,
      roundStart: 0,
      penalty: 0,
      roundTime: 0,
      roundOk: false,
      done: false,
      totalTime: 0,
    };
  }

  /* ---------- 패널 그리기 ---------- */
  function clearPanel(pos) {
    const n = num(pos);
    const c = el2('ch' + n);
    if (c) c.innerHTML = '';
    const t = el2('qt' + n);
    if (t) t.textContent = '…';
    const e = el2('qe' + n);
    if (e) e.textContent = '';
    const cb = el2('combo' + n);
    if (cb) cb.textContent = '';
    const bar = el2('tb' + n);
    if (bar) { bar.style.width = '0%'; bar.className = ''; }
  }
  function coverPanel(pos, text, kind) {
    const p = pan(pos);
    if (!p) return;
    p.classList.add('picking');
    p.classList.toggle('wait', kind === 'wait');
    const g = el2('pp' + num(pos));
    if (g) g.hidden = true;
    const cv = el2('pc' + num(pos));
    const tx = el2('pct' + num(pos));
    if (cv) cv.hidden = false;
    if (tx) tx.textContent = text;
  }
  function showQ(pos) {
    const p = pan(pos);
    if (!p) return;
    p.classList.remove('picking', 'wait');
    const g = el2('pp' + num(pos));
    if (g) g.hidden = true;
    const cv = el2('pc' + num(pos));
    if (cv) cv.hidden = true;
  }
  function openPick(pos) {
    const p = pan(pos);
    if (!p) return;
    p.classList.add('picking');
    p.classList.remove('wait');
    clearPanel(pos);
    paintPickGrid(pos);
    const g = el2('pp' + num(pos));
    if (g) g.hidden = false;
    const cv = el2('pc' + num(pos));
    if (cv) cv.hidden = true;
  }
  function paintPickGrid(pos) {
    const s = D.s[pos];
    const n = num(pos);
    const host = el2('pg' + n);
    const h = el2('pph' + n);
    if (h) {
      h.textContent = '🐾 ' + D.round + '라운드 · ' + (s.practice ? '연습 친구 중에서' : '내 도감에서') + ' 비밀 선택';
    }
    if (!host) return;
    host.innerHTML = s.pool.slice(0, 20).map((id) => {
      const p = byId(id) || { name: '#' + id };
      return '<button type="button" class="pc" data-pos="' + pos + '" data-id="' + id + '">'
        + '<img src="' + SPR(id) + '" alt="" loading="lazy"><span>' + p.name + '</span></button>';
    }).join('');
  }

  /* ---------- 라운드 흐름 ---------- */
  function paintHud() {
    [['p1', 'hud1Name', 'hud1Pt', 'hp1'], ['p2', 'hud2Name', 'hud2Pt', 'hp2']].forEach((row) => {
      const s = D.s[row[0]];
      if (!s) return;
      el2(row[1]).textContent = s.name;
      el2(row[2]).textContent = s.partner ? s.partner.name : (s.practice ? '연습 친구' : '비밀 선택');
      const pips = el2(row[3]);
      let html = '';
      for (let i = 0; i < MAXHP; i += 1) html += '<i class="' + (i < s.hp ? 'on' : '') + '"></i>';
      pips.innerHTML = html;
      pips.classList.toggle('crit', s.hp <= 2);
    });
    const mid = el2('midLab');
    if (mid) mid.textContent = D.round + 'R';
  }

  function paintTheme() {
    [['p1', 'bg1', 'motes1'], ['p2', 'bg2', 'motes2']].forEach((row) => {
      const s = D.s[row[0]];
      const p = s.partner;
      const t = (p && p.types && p.types[0]) || '노말';
      const key = THEME_OF[t] || 'forest';
      const bg = el2(row[1]);
      if (!bg) return;
      bg.dataset.theme = key;
      const host = el2(row[2]);
      if (host) {
        host.innerHTML = '';
        for (let i = 0; i < 7; i += 1) {
          const d = document.createElement('i');
          d.className = 'pb2-mote';
          const w = 3 + Math.random() * 4;
          d.style.cssText = 'left:' + (Math.random() * 96).toFixed(1) + '%;top:' + (10 + Math.random() * 70).toFixed(1)
            + '%;width:' + w.toFixed(1) + 'px;height:' + w.toFixed(1) + 'px;background:#fffdf0;'
            + 'animation:pb2-' + (i % 2 ? 'down' : 'up') + ' ' + (3.6 + Math.random() * 3).toFixed(2) + 's linear '
            + (Math.random() * 3).toFixed(2) + 's infinite';
          host.appendChild(d);
        }
      }
    });
    ['p1', 'p2'].forEach((pos) => {
      const s = D.s[pos];
      const wrap = el2('f' + num(pos));
      if (!wrap || !s) return;
      const img = wrap.querySelector('img');
      const pid = s.partner ? s.partner.id : (partnerId(s.slot) || 25);
      img.onerror = () => { img.onerror = null; img.src = SPR(pid); };
      img.src = s.partner ? ART(pid) : SPR(pid);
      img.alt = s.partner ? s.partner.name : '';
      wrap.querySelector('.fnm').textContent = s.partner ? s.partner.name : '';
      wrap.classList.toggle('dim', !s.partner);
    });
  }

  function paintBadges() {
    ['p1', 'p2'].forEach((pos) => {
      const s = D.s[pos];
      const bd = el2('bd' + num(pos));
      if (!bd) return;
      bd.hidden = !s.bump;
    });
  }
  function paintCombo(side) {
    const c = el2('combo' + num(side.pos));
    if (!c) return;
    if (D.mode === 'turn') return;        // 턴제는 시간 표시를 따로 쓴다
    c.textContent = side.combo > 1 ? '🔥' + side.combo : '';
  }

  function showReveal(pos, poke) {
    const box = el2('rv' + num(pos));
    if (!box) return;
    const img = box.querySelector('img');
    img.src = ART(poke.id);
    img.onerror = () => { img.onerror = null; img.src = SPR(poke.id); };
    img.alt = poke.name;
    const nm = el2('rn' + num(pos));
    if (nm) nm.textContent = poke.name + (poke.types && poke.types.length ? ' · ' + poke.types.join('·') : '');
    box.hidden = false;
    box.classList.remove('open');
    void box.offsetWidth;
    box.classList.add('open');
  }
  function hideReveal() {
    ['1', '2'].forEach((n) => {
      const box = el2('rv' + n);
      if (box) { box.hidden = true; box.classList.remove('open'); }
    });
  }

  function beginRound() {
    if (!D.on || D.over) return;
    BGM.music(musicForRound());      /* 일반 라운드는 battle, 마지막·매치포인트는 boss */
    hideReveal();
    D.pick = { p1: 0, p2: 0 };
    D.lock = { p1: false, p2: false };
    D.adv = { p1: false, p2: false };
    ['p1', 'p2'].forEach((pos) => {
      const s = D.s[pos];
      clearInterval(s.timer);
      s.partner = null;
      s.q = null;
      s.locked = false;
      s.combo = 0;
      s.bump = false;
      s.done = false;
      s.penalty = 0;
      s.roundTime = 0;
      s.roundOk = false;
      clearPanel(pos);
    });
    paintHud();
    paintTheme();
    paintBadges();
    openPick('p1');
    coverPanel('p2', '🔒 ' + josa(D.s.p1.name, '이가') + ' 고르는 중이에요', 'wait');
    setHintBar('🐾 ' + D.round + '라운드 — 먼저 ' + josa(D.s.p1.name, '이가') + ' 몰래 포켓몬을 골라요');
  }

  function choosePoke(pos, id) {
    if (!D.on || D.over) return { ok: false, why: 'off' };
    if (D.lock[pos]) return { ok: false, why: 'locked' };
    const s = D.s[pos];
    const pid = Number(id);
    if (s.pool.indexOf(pid) < 0) return { ok: false, why: 'notmine' };
    D.pick[pos] = pid;
    D.lock[pos] = true;
    coverPanel(pos, '🔒 비밀 선택 완료', 'lock');
    Sfx.click();
    if (pos === 'p1' && !D.lock.p2) {
      openPick('p2');
      setHintBar('🐾 ' + D.s.p2.name + ' 차례 — 상대가 뭘 골랐는지 보이지 않아요!');
    }
    if (D.lock.p1 && D.lock.p2) setTimeout(revealRound, 380);
    return { ok: true, pick: pid };
  }

  function revealRound() {
    if (!D.on || D.over) return;
    const a = D.s.p1;
    const b = D.s.p2;
    a.partner = byId(D.pick.p1) || { id: D.pick.p1, name: '#' + D.pick.p1, types: ['노말'] };
    b.partner = byId(D.pick.p2) || { id: D.pick.p2, name: '#' + D.pick.p2, types: ['노말'] };
    const s1 = !!(POK3 && POK3.strongPair(a.partner.types || [], b.partner.types || []));
    const s2 = !!(POK3 && POK3.strongPair(b.partner.types || [], a.partner.types || []));
    D.adv.p1 = s2 && !s1;      // 첫째가 상성 불리
    D.adv.p2 = s1 && !s2;      // 둘째가 상성 불리
    a.bump = D.adv.p1;
    b.bump = D.adv.p2;
    paintHud();
    paintTheme();
    paintBadges();
    showReveal('p1', a.partner);
    showReveal('p2', b.partner);       // 동시 공개
    Sfx.tone(620, 0.14, 'triangle', 0.05, 980);
    setTimeout(() => Sfx.cry(a.partner.id), 280);
    setTimeout(() => Sfx.cry(b.partner.id), 580);
    const dis = D.adv.p1 ? a : D.adv.p2 ? b : null;
    setHintBar('⚔️ ' + a.partner.name + ' vs ' + b.partner.name
      + (dis ? ' — ' + josa(dis.name, '은는') + ' 상성 불리! 이번 문제가 조금 어려워요' : ' — 팽팽한 승부!'));
    setTimeout(() => {
      if (!D.on || D.over) return;
      hideReveal();
      startQuestions();
    }, 1450);
  }

  function startQuestions() {
    if (!D.on || D.over) return;
    if (D.mode === 'turn') {
      coverPanel('p2', '🔒 ' + D.s.p1.name + ' 차례예요 — 잠깐 기다려요', 'wait');
      showCurtain({
        emoji: '⏱️',
        title: D.s.p1.name + ' 차례!',
        sub: D.round + '라운드 · 화면을 ' + D.s.p1.name + '에게 넘겨주세요',
        btn: '준비됐어요 ▶',
        onOk: () => askQuestion('p1'),
      });
      return;
    }
    showQ('p1');
    showQ('p2');
    setHintBar('⚡ 먼저 맞히는 사람이 이번 라운드를 가져가요!');
    nextQ(D.s.p1);
    nextQ(D.s.p2);
  }

  /* ---------- ⏱️ 턴제 ---------- */
  function askQuestion(pos) {
    if (!D.on || D.over) return;
    const s = D.s[pos];
    showQ(pos);
    s.q = makeQ(s);
    s.locked = false;
    s.done = false;
    s.penalty = 0;
    s.roundTime = 0;
    s.roundOk = false;
    s.roundStart = performance.now();
    paintQ(s);
    startTurnClock(s);
    setHintBar('⏱️ ' + s.name + ' 차례 — 빨리 맞힐수록 좋아요! (틀리면 +3초)');
  }

  function startTurnClock(s) {
    clearInterval(s.timer);
    const n = num(s.pos);
    const tick = () => {
      if (!D.on || D.over || s.done) { clearInterval(s.timer); return; }
      const el = (performance.now() - s.roundStart) / 1000 + s.penalty;
      const c = el2('combo' + n);
      if (c) c.textContent = '⏱ ' + el.toFixed(1) + '초';
      const bar = el2('tb' + n);
      if (bar) {
        bar.style.width = clamp((el / 30) * 100, 0, 100) + '%';
        bar.className = el > 20 ? 'crit' : el > 12 ? 'warn' : '';
      }
    };
    tick();
    s.timer = setInterval(tick, 100);
  }

  function answerTurn(s, idx) {
    if (!D.on || D.over || s.done || !s.q) return;
    s.done = true;
    clearInterval(s.timer);
    const ok = String(s.q.choices[idx]) === String(s.q.ans);
    const spent = (performance.now() - s.roundStart) / 1000;
    s.roundOk = ok;
    if (ok) {
      s.right += 1;
      s.combo += 1;
      Sfx.correct();
    } else {
      s.wrong += 1;
      s.combo = 0;
      s.penalty += 3;
      Sfx.wrong();
    }
    s.roundTime = Math.round((spent + s.penalty) * 10) / 10;
    reveal(s, idx);
    const n = num(s.pos);
    const c = el2('combo' + n);
    if (c) c.textContent = '⏱ ' + s.roundTime.toFixed(1) + '초';
    if (!ok) popPenalty(s);
    setTimeout(() => {
      if (!D.on || D.over) return;
      if (s.pos === 'p1') {
        coverPanel('p1', '🔒 ' + josa(s.name, '은는') + ' 기록 완료 · ' + s.roundTime.toFixed(1) + '초', 'wait');
        showCurtain({
          emoji: '⏱️',
          title: D.s.p2.name + ' 차례!',
          sub: '화면을 ' + D.s.p2.name + '에게 넘겨주세요',
          btn: '준비됐어요 ▶',
          onOk: () => askQuestion('p2'),
        });
      } else {
        settleTurnRound();
      }
    }, 1050);
  }

  function settleTurnRound() {
    const a = D.s.p1;
    const b = D.s.p2;
    a.totalTime = Math.round((a.totalTime + a.roundTime) * 10) / 10;
    b.totalTime = Math.round((b.totalTime + b.roundTime) * 10) / 10;
    let win = null;
    if (a.roundTime < b.roundTime) win = a;
    else if (b.roundTime < a.roundTime) win = b;
    else if (a.roundOk !== b.roundOk) win = a.roundOk ? a : b;
    if (win) {
      const loser = other(win);
      loser.hp = Math.max(0, loser.hp - 1);
      popDmg(loser, 1, false);
      flashHurt(loser);
    }
    D.history.push({
      round: D.round, mode: 'turn',
      pick: { p1: D.pick.p1, p2: D.pick.p2 },
      t: { p1: a.roundTime, p2: b.roundTime },
      ok: { p1: a.roundOk, p2: b.roundOk },
      win: win ? win.pos : null,
    });
    paintHud();
    showCurtain({
      emoji: win ? '🏅' : '🤝',
      title: D.round + '라운드 — ' + (win ? win.name + ' 승!' : '무승부'),
      sub: a.name + ' ' + a.roundTime.toFixed(1) + '초 · ' + b.name + ' ' + b.roundTime.toFixed(1) + '초'
        + ' · 누적 ' + a.name + ' ' + a.totalTime.toFixed(1) + '초 / ' + b.name + ' ' + b.totalTime.toFixed(1) + '초',
      btn: D.round >= MAXROUND ? '결과 보기 ▶' : (D.round + 1) + '라운드 ▶',
      onOk: endRound,
    });
  }

  /* ---------- ⚡ 스피드 ---------- */
  function paintQ(side) {
    const n = num(side.pos);
    const q = side.q;
    el2('qn' + n).textContent = side.name;
    paintCombo(side);
    const bd = el2('bd' + n);
    if (bd) bd.hidden = !side.bump;
    if (!q) return;
    el2('qe' + n).textContent = q.emoji || '';
    el2('qt' + n).textContent = q.prompt || '';
    const host = el2('ch' + n);
    host.innerHTML = q.choices.map((c, i) =>
      '<button class="choice" data-i="' + i + '"><i class="n">' + (i + 1) + '</i><span>' + String(c) + '</span></button>').join('');
    $$('.choice', host).forEach((b) => {
      b.addEventListener('click', () => answer(side, Number(b.dataset.i)));
    });
  }

  function paintTimer(side) {
    const bar = el2('tb' + num(side.pos));
    if (!bar) return;
    bar.style.width = (clamp(side.tleft / 30, 0, 1) * 100) + '%';
    bar.className = side.tleft <= 6 ? 'crit' : side.tleft <= 12 ? 'warn' : '';
  }

  function startTimer(side) {
    clearInterval(side.timer);
    side.tleft = 30;
    paintTimer(side);
    side.timer = setInterval(() => {
      if (!D.on || D.over || side.done) { clearInterval(side.timer); return; }
      side.tleft -= 0.1;
      if (side.tleft <= 0) {
        side.tleft = 0;
        paintTimer(side);
        clearInterval(side.timer);
        timeout(side);
        return;
      }
      paintTimer(side);
    }, 100);
  }

  function nextQ(side) {
    side.locked = false;
    side.done = false;
    side.q = makeQ(side);
    paintQ(side);
    startTimer(side);
  }

  function timeout(side) {
    if (!D.on || D.over || side.locked || side.done) return;
    side.locked = true;
    side.done = true;
    side.combo = 0;
    side.wrong += 1;
    Sfx.wrong();
    reveal(side, -1);
    selfHurt(side);
    if (other(side).done) endRoundNoWin();
  }

  function answer(side, idx) {
    if (!D.on || D.over || side.locked || !side.q || side.done) return;
    if (D.mode !== 'speed') { answerTurn(side, idx); return; }
    side.locked = true;
    clearInterval(side.timer);
    const ok = String(side.q.choices[idx]) === String(side.q.ans);
    const host = el2('ch' + num(side.pos));
    if (host) {
      $$('.choice', host).forEach((b, i) => {
        b.disabled = true;
        if (String(side.q.choices[i]) === String(side.q.ans)) b.classList.add('ok');
        else if (i === idx) b.classList.add('no');
      });
    }
    if (ok) {
      side.combo += 1;
      side.right += 1;
      Sfx.correct();
      paintCombo(side);
      winRound(side);
    } else {
      side.combo = 0;
      side.wrong += 1;
      side.done = true;
      Sfx.wrong();
      paintCombo(side);
      selfHurt(side);
      if (other(side).done && !D.over) endRoundNoWin();
    }
  }

  function reveal(side, idx) {
    const host = el2('ch' + num(side.pos));
    if (!host || !side.q) return;
    $$('.choice', host).forEach((b, i) => {
      b.disabled = true;
      if (String(side.q.choices[i]) === String(side.q.ans)) b.classList.add('ok');
      else if (i === idx) b.classList.add('no');
    });
  }

  function popDmg(side, amount, se) {
    const half = el2('half' + num(side.pos));
    if (!half) return;
    const el = document.createElement('div');
    el.className = 'dmgpop';
    el.textContent = '−' + amount;
    half.appendChild(el);
    setTimeout(() => el.remove(), 950);
    if (se) {
      const b = document.createElement('div');
      b.className = 'sebanner';
      b.textContent = '💥 효과가 굉장했다!';
      half.appendChild(b);
      setTimeout(() => b.remove(), 1500);
    }
  }
  function popPenalty(side) {
    const half = el2('half' + num(side.pos));
    if (!half) return;
    const el = document.createElement('div');
    el.className = 'dmgpop';
    el.style.color = '#e8760a';
    el.textContent = '＋3초';
    half.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }
  function flashHurt(side) {
    const f = el2('f' + num(side.pos));
    if (!f) return;
    f.classList.remove('hurt');
    void f.offsetWidth;
    f.classList.add('hurt');
    setTimeout(() => f.classList.remove('hurt'), 620);
  }

  function selfHurt(side) {
    side.hp = Math.max(0, side.hp - 1);
    popDmg(side, 1, false);
    flashHurt(side);
    paintHud();
    if (side.hp <= 0 && !D.over) finish(other(side));
  }

  function flashScreen() {
    const f = el2('flash');
    if (!f) return;
    f.classList.remove('go');
    void f.offsetWidth;
    f.classList.add('go');
  }

  function winRound(winner) {
    const loser = other(winner);
    loser.locked = true;
    loser.done = true;
    clearInterval(loser.timer);
    const strong = !!(POK3 && winner.partner && loser.partner
      && POK3.strongPair(winner.partner.types || [], loser.partner.types || []));
    D.history.push({
      round: D.round, mode: 'speed',
      pick: { p1: D.pick.p1, p2: D.pick.p2 },
      win: winner.pos, dmg: strong ? 2 : 1,
    });
    strike(winner, loser, strong, () => {
      if (!D.on || D.over) return;
      if (loser.hp <= 0) { finish(winner); return; }
      endRound();
    });
  }

  /* 타격 파티클 — 산수·한글·영어와 같은 공용 CSS(.pb2-pt/.pb2-ring/.pb2-spark)를 쓴다 */
  const FXPAL = {
    '물': ['#e8fdff', '#7fe0ff', '#2196f3', '#ffffff'],
    '불꽃': ['#fff9c4', '#ffd166', '#ff7f2a', '#ff3d00'],
    '전기': ['#fffde0', '#ffe873', '#ffc400', '#ffffff'],
    '풀': ['#f2ffd0', '#b6f07a', '#4caf50', '#2e7d32'],
    '얼음': ['#ffffff', '#d9f7ff', '#8fe4ff', '#bfe9ff'],
    '에스퍼': ['#ffe3ff', '#f7a8ff', '#c04de0', '#ffffff'],
    '고스트': ['#f0d8ff', '#b98cff', '#7b2fff', '#4a0a7a'],
    '악': ['#ded0ff', '#9a7bff', '#5a1fa8', '#1b0b2e'],
    '바위': ['#f7ecc9', '#d9bd82', '#a87c3c', '#6d4a1c'],
    '땅': ['#f7e6c0', '#e0c48a', '#b07f2f', '#7a5520'],
    '비행': ['#ffffff', '#d8f0ff', '#9ad8ff', '#5aa8d8'],
    '페어리': ['#ffe6f2', '#ffb3d9', '#ff5fa2', '#c2185b'],
    '드래곤': ['#ece2ff', '#c9a8ff', '#7a4dff', '#3a1f8a'],
    '강철': ['#ffffff', '#e2e8f0', '#a8b4c4', '#6b7787'],
    '격투': ['#ffe3cf', '#ff9a6b', '#e5493a', '#8a1a10'],
    '벌레': ['#f6ffd8', '#c8ee7a', '#8bc34a', '#4f8a1f'],
    '독': ['#fbe0ff', '#e2a8ff', '#a040a0', '#5a0a5a'],
    '노말': ['#ffffff', '#fff3c4', '#ffd166', '#c9a227'],
  };
  const FXPAL_STAR = { '불꽃': 1, '전기': 1, '드래곤': 1, '강철': 1, '페어리': 1, '에스퍼': 1 };
  function sparkBurst(x, y, type, strong) {
    const host = el2('fx');
    if (!host) return;
    const pal = FXPAL[type] || FXPAL['노말'];
    const n = strong ? 24 : 14;
    const spread = strong ? 122 : 80;
    for (let i = 0; i < n; i += 1) {
      const p = document.createElement('div');
      const star = !!FXPAL_STAR[type] && Math.random() < 0.6;
      p.className = 'pb2-pt' + (star ? ' star' : '');
      const size = star ? 9 + Math.random() * 12 : 5 + Math.random() * 9;
      const c = pal[i % pal.length];
      p.style.cssText = 'left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;'
        + 'width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1) + 'px;background:' + c
        + ';box-shadow:0 0 ' + (5 + size * 0.5).toFixed(0) + 'px ' + c;
      host.appendChild(p);
      const ang = (Math.PI * 2 * i) / n + Math.random() * 0.8;
      const dist = spread * (0.45 + Math.random() * 0.9);
      const dx = Math.cos(ang) * dist;
      const dy = Math.sin(ang) * dist * 0.86 - spread * 0.16;
      try {
        p.animate([
          { transform: 'translate(-50%,-50%) scale(.35)', opacity: 0 },
          { transform: 'translate(calc(-50% + ' + (dx * 0.34).toFixed(1) + 'px), calc(-50% + ' + (dy * 0.34).toFixed(1) + 'px)) scale(1.05)', opacity: 1, offset: 0.26 },
          { transform: 'translate(calc(-50% + ' + dx.toFixed(1) + 'px), calc(-50% + ' + (dy + 16).toFixed(1) + 'px)) scale(.22)', opacity: 0 },
        ], { duration: 520 + Math.random() * 520, easing: 'cubic-bezier(.15,.6,.3,1)' }).finished
          .then(() => p.remove()).catch(() => p.remove());
      } catch (e) { p.remove(); }
    }
    /* 충격파 링 + 섬광 */
    const ring = document.createElement('div');
    ring.className = 'pb2-ring';
    const from = 12;
    ring.style.cssText = 'left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;'
      + 'width:' + from * 2 + 'px;height:' + from * 2 + 'px;margin:' + (-from) + 'px 0 0 ' + (-from) + 'px;'
      + 'border-width:4px;border-color:' + pal[2] + ';color:' + pal[2];
    host.appendChild(ring);
    const sc = Math.max(0.2, spread * (strong ? 1.5 : 1.1) / from);
    try {
      ring.animate([{ transform: 'scale(.3)', opacity: 0.95 }, { transform: 'scale(' + sc.toFixed(2) + ')', opacity: 0 }],
        { duration: 640, easing: 'cubic-bezier(.1,.7,.3,1)' }).finished.then(() => ring.remove()).catch(() => ring.remove());
    } catch (e) { ring.remove(); }
    const sp = document.createElement('div');
    sp.className = 'pb2-spark';
    const w = Math.round(spread * 0.9);
    sp.style.cssText = 'left:' + x.toFixed(1) + 'px;top:' + y.toFixed(1) + 'px;width:' + w + 'px;height:' + w + 'px;margin:' + (-w / 2) + 'px 0 0 ' + (-w / 2) + 'px';
    host.appendChild(sp);
    try {
      sp.animate([{ transform: 'scale(.25)', opacity: 0 }, { transform: 'scale(.9)', opacity: 1, offset: 0.22 }, { transform: 'scale(1.35)', opacity: 0 }],
        { duration: 300, easing: 'ease-out' }).finished.then(() => sp.remove()).catch(() => sp.remove());
    } catch (e) { sp.remove(); }
  }

  function strike(att, def, strong, done) {
    const fromEl = el2('f' + num(att.pos));
    const toEl = el2('f' + num(def.pos));
    const type = (att.partner && att.partner.types && att.partner.types[0]) || '노말';
    const dmg = strong ? 2 : 1;
    Sfx.hit(type);
    let dur = 380;
    try {
      const a = fromEl.getBoundingClientRect();
      const b = toEl.getBoundingClientRect();
      const x0 = a.left + a.width / 2;
      const y0 = a.top + a.height * 0.45;
      const x1 = b.left + b.width / 2;
      const y1 = b.top + b.height * 0.5;
      fromEl.classList.remove('jump');
      void fromEl.offsetWidth;
      fromEl.classList.add('jump');
      setTimeout(() => fromEl.classList.remove('jump'), 600);
      const p = document.createElement('div');
      p.className = 'proj ' + (PROJ[type] || 'normal') + (strong ? ' big' : '');
      p.style.left = x0 + 'px';
      p.style.top = y0 + 'px';
      el2('fx').appendChild(p);
      dur = clamp(Math.abs(x1 - x0) * 0.85 + 260, 280, 620);
      p.animate([
        { transform: 'translate(0,0) scale(.6)', opacity: 0 },
        { transform: 'translate(' + (x1 - x0) * 0.5 + 'px,' + ((y1 - y0) * 0.5 - 46) + 'px) scale(1)', opacity: 1, offset: 0.5 },
        { transform: 'translate(' + (x1 - x0) + 'px,' + (y1 - y0) + 'px) scale(1.1)', opacity: 1 },
      ], { duration: dur, easing: 'cubic-bezier(.3,.05,.5,1)' }).finished
        .then(() => p.remove()).catch(() => p.remove());
    } catch (e) { /* */ }
    setTimeout(() => {
      if (!D.on) return;
      def.hp = Math.max(0, def.hp - dmg);
      /* 명중 순간 — 타입 컬러 파티클 · 충격파 · 섬광 (강타면 피격 무대가 흔들린다) */
      try {
        const ib = toEl.getBoundingClientRect();
        sparkBurst(ib.left + ib.width / 2, ib.top + ib.height * 0.5, type, strong);
      } catch (e) { /* */ }
      if (strong) {
        toEl.classList.remove('pb2-quake');
        void toEl.offsetWidth;
        toEl.classList.add('pb2-quake');
        setTimeout(() => toEl.classList.remove('pb2-quake'), 560);
      }
      popDmg(def, dmg, strong);
      flashHurt(def);
      if (strong) flashScreen();
      paintHud();
      if (typeof done === 'function') done();
    }, clamp(dur * 0.75 + 120, 240, 560));
  }

  function endRoundNoWin() {
    if (D.over) return;
    D.history.push({
      round: D.round, mode: D.mode,
      pick: { p1: D.pick.p1, p2: D.pick.p2 }, win: null,
    });
    setHintBar('🤝 ' + D.round + '라운드 무승부 — 다음 라운드로!');
    setTimeout(endRound, 700);
  }

  function endRound() {
    clearInterval(D.s.p1.timer);
    clearInterval(D.s.p2.timer);
    if (!D.on || D.over) return;
    if (D.s.p1.hp <= 0 || D.s.p2.hp <= 0 || D.round >= MAXROUND) { finish(null); return; }
    D.round += 1;
    setTimeout(beginRound, 260);
  }

  function finish(forced) {
    if (D.over) return;
    D.over = true;
    BGM.stopMusic(1.6);              /* 승부가 나면 음악을 걷고 승리 팡파르만 남긴다 */
    clearInterval(D.s.p1.timer);
    clearInterval(D.s.p2.timer);
    const a = D.s.p1;
    const b = D.s.p2;
    let w = forced || null;
    if (!w) {
      if (a.hp !== b.hp) w = a.hp > b.hp ? a : b;
      else if (a.right !== b.right) w = a.right > b.right ? a : b;
      else if (D.mode === 'turn' && a.totalTime !== b.totalTime) w = a.totalTime < b.totalTime ? a : b;
      else if (a.wrong !== b.wrong) w = a.wrong < b.wrong ? a : b;
    }
    if (w) {
      const loser = other(w);
      /* 피니셔 — 마지막 한 방: 폭발 링 + 강타 문구 + 화면 흔들림 */
      try {
        const lf = el2('f' + num(loser.pos));
        const half = lf.parentNode;
        const ar = lf.getBoundingClientRect();
        const hb = half.getBoundingClientRect();
        const blast = document.createElement('span');
        blast.className = 'finish-blast';
        blast.style.left = (ar.left + ar.width / 2 - hb.left) + 'px';
        blast.style.top = (ar.top + ar.height / 2 - hb.top) + 'px';
        half.appendChild(blast);
        const tx = document.createElement('b');
        tx.className = 'finish-text';
        tx.textContent = '💥 피니셔!';
        half.appendChild(tx);
        const field = el2('field');
        field.classList.remove('shake');
        void field.offsetWidth;
        field.classList.add('shake');
        setTimeout(() => field.classList.remove('shake'), 600);
        lf.classList.add('out');
      } catch (e) { /* */ }
      flashScreen();
      Sfx.fanfare();
    }
    setHintBar(w ? '🏆 ' + w.name + ' 승리!' : '🤝 무승부!');
    setTimeout(() => openOver(w), w ? 1100 : 500);
  }

  /* ---------- 턴제 커튼 ---------- */
  let curtainOk = null;
  function showCurtain(o) {
    const box = el2('curtain');
    if (!box) return;
    el2('curEmo').textContent = o.emoji || '🐾';
    el2('curTitle').textContent = o.title || '';
    el2('curSub').textContent = o.sub || '';
    const btn = el2('curBtn');
    btn.textContent = o.btn || '확인';
    btn.hidden = !o.btn;
    curtainOk = o.onOk || null;
    box.hidden = false;
  }
  function hideCurtain() {
    const box = el2('curtain');
    if (box) box.hidden = true;
    curtainOk = null;
  }
  function confirmCurtain() {
    const fn = curtainOk;
    hideCurtain();
    if (typeof fn === 'function') fn();
    return true;
  }

  /* ---------- 보상 ---------- */
  function openOver(winner) {
    D.winner = winner || null;
    const draw = !winner;
    const a = D.s.p1;
    const b = D.s.p2;
    $('#overCup').textContent = draw ? '🤝' : '🏆';
    $('#overTitle').textContent = draw ? '무승부!' : winner.name + ' 승리!';
    const bits = [];
    if (a.partner || b.partner) {
      bits.push((a.partner ? a.partner.name : '-') + ' vs ' + (b.partner ? b.partner.name : '-'));
    }
    bits.push(a.name + ' ' + a.right + '정답 · HP ' + a.hp + '/' + MAXHP);
    bits.push(b.name + ' ' + b.right + '정답 · HP ' + b.hp + '/' + MAXHP);
    if (D.mode === 'turn') {
      bits.push('누적 ' + a.totalTime.toFixed(1) + '초 / ' + b.totalTime.toFixed(1) + '초');
    }
    $('#overWho').textContent = bits.join(' · ');
    $('#pickLabel').textContent = draw
      ? '이번에는 보상이 없어요 — 다시 붙어 봐요!'
      : winner.name + '님만 받는 보상 — 하나를 골라요!';
    $('#picks').style.display = draw ? 'none' : '';
    $('#got').classList.remove('on');
    $('#got').textContent = '';
    $('#after').classList.toggle('on', draw);
    $$('#picks .pick').forEach((b2) => { b2.disabled = false; });
    $('#over').classList.add('on');
  }

  function grantReward(kind) {
    const w = D.winner;
    if (!w) return null;
    if (kind === 'ball') {
      const key = 'pkm.balls.v1.' + w.slot;
      const b = lsGet(key, null) || { super: 2, hyper: 0, master: 0 };
      b.super = (Number(b.super) || 0) + 1;
      lsSet(key, b);
      return { emoji: '🔵', text: '슈퍼볼 1개를 받았어요! (지금 ' + b.super + '개)' };
    }
    const inv = lsGet('pkm.village.inv.v1.' + w.slot, {}) || {};
    const keys = POK3 ? POK3.itemKeys() : ['tent'];
    const k = keys[Math.floor(Math.random() * keys.length)];
    inv[k] = (inv[k] || 0) + 1;
    lsSet('pkm.village.inv.v1.' + w.slot, inv);
    const it = POK3 ? POK3.item(k) : { emoji: '🏡', name: '마을 아이템' };
    return { emoji: it.emoji, text: it.name + ' 1개를 받았어요! 마을에 놓아 보세요' };
  }

  /* ---------- 시작 / 다시 ---------- */
  function paintMode() {
    $$('#modeBar button').forEach((b) => b.classList.toggle('on', b.dataset.mode === D.mode));
  }
  function setMode(m) {
    D.mode = (m === 'turn') ? 'turn' : 'speed';
    lsSet('pkm.versus.mode.v1', D.mode);
    paintMode();
    const hint = $('#setHint');
    if (hint) {
      hint.textContent = D.mode === 'turn'
        ? '한 명씩 5문제 · 틀리면 +3초 · 총 시간이 짧은 쪽이 이겨요'
        : '둘이 동시에 문제를 풀어 먼저 맞히면 상대 HP가 줄어요';
    }
    return D.mode;
  }

  function startDuel() {
    if (D.chosen.p1 === D.chosen.p2) { validate(); return; }
    Sfx.ensure();
    Sfx.click();
    hideCurtain();
    D.s.p1 = makeSide(D.chosen.p1, cfgOf(D.chosen.p1), 'p1');
    D.s.p2 = makeSide(D.chosen.p2, cfgOf(D.chosen.p2), 'p2');
    D.on = true;
    D.over = false;
    D.winner = null;
    D.round = 1;
    D.history = [];
    $('#setup').style.display = 'none';
    $('#duel').classList.add('on');
    $('#over').classList.remove('on');
    ['1', '2'].forEach((n) => {
      const f = el2('f' + n);
      if (f) f.className = 'fighter dim';
      const box = el2('rv' + n);
      if (box) { box.hidden = true; box.classList.remove('open'); }
      const bad = el2('bd' + n);
      if (bad) bad.hidden = true;
    });
    paintHud();
    paintTheme();
    beginRound();
  }

  /* ---------- 준비 화면 인터랙션 보정 ---------- */
  /* 카드별 선택 슬롯(누구?)은 카드가 기억한다 */
  function bindSetup() {
    document.addEventListener('click', (e) => {
      const b = e.target.closest('#cards .seg button');
      if (!b) return;
      const seg = b.closest('.seg');
      const card = b.closest('.scard');
      const side = card.dataset.side;
      const kind = seg.dataset.k;
      if (kind === 'slot') {
        const next = b.dataset.v;
        const otherSide = side === 'p2' ? D.chosen.p1 : D.chosen.p2;
        if (next === otherSide) {
          $('#setHint').textContent = '두 사람은 서로 다른 친구를 골라 주세요!';
          setTimeout(() => { if ($('#setHint').textContent.indexOf('서로 다른') === 0) $('#setHint').textContent = ''; }, 2200);
          return;
        }
        D.chosen[side] = next;
        lsSet('pkm.versus.cfg.v1.' + next, cfgOf(next));
      } else {
        const cfg = cfgOf(D.chosen[side]);
        cfg[kind] = b.dataset.v;
        lsSet('pkm.versus.cfg.v1.' + D.chosen[side], cfg);
      }
      Sfx.click();
      paintCardsOnly();
      validate();
    });
  }

  function paintCardsOnly() {
    ['p1', 'p2'].forEach((side) => {
      const card = document.querySelector('#cards .scard[data-side="' + side + '"]');
      if (!card) return;
      const slot = D.chosen[side];
      const cfg = cfgOf(slot);
      const ids = dexIds(slot);
      const pid = partnerId(slot);
      const p = pid ? byId(pid) : null;
      card.querySelector('.nm').textContent = slotName(slot);
      card.querySelector('.prev').innerHTML = p
        ? '<img src="' + SPR(p.id) + '" alt=""><span class="pi"><b>' + p.name + '</b>'
          + '<span>' + (p.types || []).join(' · ') + ' · 도감 ' + ids.length + '마리</span></span>'
        : '<img src="' + SPR(25) + '" alt=""><span class="pi"><b>연습 피카츄</b>'
          + '<span>아직 잡은 포켓몬이 없어 연습 파트너로 나가요</span></span>';
      card.querySelectorAll('.seg').forEach((seg) => {
        const kind = seg.dataset.k;
        seg.querySelectorAll('button').forEach((b) => {
          const on = kind === 'slot' ? b.dataset.v === slot : b.dataset.v === cfg[kind];
          b.classList.toggle('on', on);
        });
      });
    });
  }

  /* ---------- 부팅 ---------- */
  function boot() {
    $('#muteBtn').textContent = Sfx.muted ? '🔇' : '🔊';
    $('#muteBtn').addEventListener('click', () => {
      Sfx.muted = !Sfx.muted;
      lsSet('pkm.mute.v1', Sfx.muted);
      $('#muteBtn').textContent = Sfx.muted ? '🔇' : '🔊';
      BGM.setMuted(Sfx.muted);   /* 배경음악도 같은 버튼으로 함께 꺼진다 */
    });
    if (Sfx.muted) BGM.setMuted(true);   /* 저장된 음소거 상태로 시작 */
    $('#startBtn').addEventListener('click', startDuel);
    $$('#modeBar button').forEach((b) => {
      b.addEventListener('click', () => { setMode(b.dataset.mode); Sfx.click(); });
    });
    const cb = $('#curBtn');
    if (cb) cb.addEventListener('click', () => { Sfx.click(); confirmCurtain(); });
    /* 비밀 선택 — 패널 그리드에서 포켓몬을 고른다 */
    document.addEventListener('click', (e) => {
      const pc = e.target.closest('.ppickg .pc');
      if (!pc) return;
      if (!D.on || D.over) return;
      choosePoke(pc.dataset.pos, Number(pc.dataset.id));
    });
    $$('#picks .pick').forEach((b) => {
      b.addEventListener('click', () => {
        const got = grantReward(b.dataset.pick);
        $$('#picks .pick').forEach((x) => { x.disabled = true; });
        const box = $('#got');
        box.textContent = got ? got.emoji + ' ' + got.text : '';
        box.classList.add('on');
        $('#pickLabel').textContent = '보상 받았어요!';
        $('#after').classList.add('on');
        Sfx.fanfare();
      });
    });
    $('#againBtn').addEventListener('click', () => {
      $('#over').classList.remove('on');
      startDuel();
    });
    $('#villageBtn').addEventListener('click', () => { location.href = './pokemon/village-pokemon.html'; });

    /* 저장해 둔 대결 방식(⚡스피드 / ⏱️턴제)을 되살린다 */
    D.mode = lsGet('pkm.versus.mode.v1', 'speed') === 'turn' ? 'turn' : 'speed';
    paintMode();
    paintSetup();
    bindSetup();
    validate();

    fetch('./pokemon-db.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : []))
      .then((db) => {
        if (!Array.isArray(db)) return;
        DB.list = db;
        db.forEach((p) => { DB.byId[p.id] = p; });
        paintCardsOnly();
      })
      .catch(() => { /* 기본 피카츄로도 대결 가능 */ });

    fetch('./hangul-bank.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : null))
      .then((o) => { if (o && Array.isArray(o.words)) BANK.hangul = o.words; })
      .catch(() => { /* */ });

    fetch('./english-bank.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : null))
      .then((o) => {
        if (!o) return;
        if (Array.isArray(o.words)) BANK.english = o.words;
        if (Array.isArray(o.sentences)) BANK.sentences = o.sentences;
      })
      .catch(() => { /* */ });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  /* 검증용 최소 API */
  window.VS = {
    audio: () => BGM.state(),
    musicFor: () => musicForRound(),
    roundTo(n) { D.round = Number(n) || 1; beginRound(); return D.round; },
    state: D,
    start: startDuel,
    setSlot(side, slot) { D.chosen[side] = slot; paintCardsOnly(); validate(); },
    setCfg(slot, cfg) { lsSet('pkm.versus.cfg.v1.' + slot, cfg); paintCardsOnly(); },
    mode(m) { return m ? setMode(m) : D.mode; },
    modeOf: () => D.mode,
    round: () => D.round,
    maxRound: () => MAXROUND,
    pick(pos, id) { return choosePoke(pos, Number(id)); },
    pickState: () => ({
      round: D.round,
      mode: D.mode,
      pick: { p1: D.pick.p1, p2: D.pick.p2 },
      lock: { p1: D.lock.p1, p2: D.lock.p2 },
      adv: { p1: D.adv.p1, p2: D.adv.p2 },
      bump: { p1: D.s.p1 && D.s.p1.bump, p2: D.s.p2 && D.s.p2.bump },
      pickOpen: { p1: !$('#pp1').hidden, p2: !$('#pp2').hidden },
      cover: { p1: $('#pc1').hidden ? '' : $('#pct1').textContent, p2: $('#pc2').hidden ? '' : $('#pct2').textContent },
      reveal: { p1: !$('#rv1').hidden, p2: !$('#rv2').hidden },
      hint: $('#hintBar').textContent,
    }),
    curtain: () => ({
      open: !$('#curtain').hidden,
      title: $('#curTitle').textContent,
      sub: $('#curSub').textContent,
      btn: $('#curBtn').textContent,
    }),
    confirm() { return confirmCurtain(); },
    times: () => ({
      p1: D.s.p1 ? D.s.p1.totalTime : 0,
      p2: D.s.p2 ? D.s.p2.totalTime : 0,
      round: { p1: D.s.p1 ? D.s.p1.roundTime : 0, p2: D.s.p2 ? D.s.p2.roundTime : 0 },
    }),
    history: () => D.history,
    panel: (pos) => ({
      picking: pan(pos).classList.contains('picking'),
      wait: pan(pos).classList.contains('wait'),
      q: D.s[pos] && D.s[pos].q ? D.s[pos].q.prompt : '',
      choices: document.querySelectorAll('#ch' + num(pos) + ' .choice').length,
      badge: !$('#bd' + num(pos)).hidden,
      locked: D.s[pos] ? D.s[pos].locked : null,
    }),
    answer(side, idx) { answer(D.s[side], idx); },
    auto(side) {
      const s = D.s[side];
      if (!s || !s.q) return -1;
      const i = s.q.choices.indexOf(String(s.q.ans));
      answer(s, i);
      return i;
    },
    wrong(side) {
      const s = D.s[side];
      if (!s || !s.q) return -1;
      const i = s.q.choices.findIndex((c) => String(c) !== String(s.q.ans));
      answer(s, i);
      return i;
    },
    hp: () => ({ p1: D.s.p1 && D.s.p1.hp, p2: D.s.p2 && D.s.p2.hp }),
    over: () => D.over,
    winner: () => (D.winner ? D.winner.pos : null),
    theme: () => ({ p1: $('#bg1').dataset.theme, p2: $('#bg2').dataset.theme }),
    partner: () => ({
      p1: D.s.p1 && D.s.p1.partner ? D.s.p1.partner.name : '',
      p2: D.s.p2 && D.s.p2.partner ? D.s.p2.partner.name : '',
    }),
    fighters: () => ({
      p1: $('#f1').querySelector('.fnm').textContent,
      p2: $('#f2').querySelector('.fnm').textContent,
      dim1: $('#f1').classList.contains('dim'),
      dim2: $('#f2').classList.contains('dim'),
    }),
    cfg: cfgOf,
    grant: grantReward,
  };
})();
</script>
