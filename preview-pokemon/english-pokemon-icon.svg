<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="포켓몬 영어 배틀">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9ef0e0"/>
      <stop offset="0.5" stop-color="#2ea6b4"/>
      <stop offset="1" stop-color="#0d5468"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9d84"/>
      <stop offset="0.42" stop-color="#f04a37"/>
      <stop offset="1" stop-color="#c3271b"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cdd6c4"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a2"/>
      <stop offset="0.5" stop-color="#ffcb42"/>
      <stop offset="1" stop-color="#e08a12"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffdf3"/>
      <stop offset="1" stop-color="#ffeec3"/>
    </linearGradient>
    <radialGradient id="gloss" cx="0.34" cy="0.26" r="0.46">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 바탕 -->
  <rect x="6" y="6" width="500" height="500" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="112" fill="none" stroke="#07333d" stroke-width="10" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="236" fill="url(#halo)"/>

  <!-- 풀숲 실루엣 -->
  <path d="M6 372c58-26 118-12 178 8s134 22 202-8c46-20 76-16 114-2v142H6z" fill="#0d6b6f" fill-opacity="0.42"/>
  <path d="M6 404c64-18 122 4 182 18s136 16 200-12c44-20 74-16 112-4v92H6z" fill="#084a55" fill-opacity="0.5"/>

  <!-- 몬스터볼 -->
  <g>
    <circle cx="256" cy="256" r="150" fill="#101010"/>
    <path d="M256 106a150 150 0 0 1 150 150H106A150 150 0 0 1 256 106z" fill="url(#red)"/>
    <path d="M106 256h300a150 150 0 0 1-300 0z" fill="url(#white)"/>
    <rect x="102" y="238" width="308" height="36" rx="8" fill="#101010"/>
    <circle cx="256" cy="256" r="54" fill="#ffffff" stroke="#101010" stroke-width="18"/>
    <circle cx="256" cy="256" r="21" fill="#cfd8c6" stroke="#101010" stroke-width="9"/>
    <ellipse cx="196" cy="180" rx="52" ry="32" fill="url(#gloss)"/>
    <path d="M256 106a150 150 0 0 1 138 90" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- 반짝이 -->
  <g fill="#f3fffd">
    <path d="M406 96c6 25 12 31 37 37-25 6-31 12-37 37-6-25-12-31-37-37 25-6 31-12 37-37z" opacity="0.95"/>
    <path d="M96 158c3.8 16.6 8.4 21.2 25 25-16.6 3.8-21.2 8.4-25 25-3.8-16.6-8.4-21.2-25-25 16.6-3.8 21.2-8.4 25-25z" opacity="0.8"/>
    <path d="M440 292c3 13 6.6 16.6 19.6 19.6-13 3-16.6 6.6-19.6 19.6-3-13-6.6-16.6-19.6-19.6 13-3 16.6-6.6 19.6-19.6z" opacity="0.7"/>
  </g>

  <!-- 영어 카드: ABC -->
  <g>
    <rect x="284" y="326" width="188" height="132" rx="26" fill="#062b33" fill-opacity="0.22" transform="translate(4 8)"/>
    <rect x="284" y="322" width="188" height="132" rx="26" fill="url(#paper)" stroke="#8a4f06" stroke-width="9"/>
    <text x="378" y="352" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif"
          font-size="34" font-weight="900" fill="#b4690b" letter-spacing="6">A·B·C</text>
    <text x="378" y="424" text-anchor="middle" font-family="Noto Sans, DejaVu Sans, sans-serif"
          font-size="72" font-weight="900" fill="#4a2a00" letter-spacing="2">ABC</text>
  </g>

  <!-- 배지: Aa -->
  <g>
    <circle cx="112" cy="398" r="62" fill="#062b33" fill-opacity="0.2" transform="translate(4 8)"/>
    <circle cx="108" cy="394" r="58" fill="url(#gold)" stroke="#8a4f06" stroke-width="8"/>
    <text x="108" y="400" text-anchor="middle" dominant-baseline="central"
          font-family="Noto Sans, DejaVu Sans, sans-serif" font-size="54" font-weight="900" fill="#5a3302">Aa</text>
  </g>
